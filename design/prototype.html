/* ================= sheets ================= */
const SHEET_IN={sheet:{yPercent:100,duration:.42,ease:'power3.out'},panel:{xPercent:100,duration:.4,ease:'power3.out'},modal:{autoAlpha:0,scale:.96,y:10,duration:.3,ease:'power3.out'}};
const SHEET_OUT={sheet:{yPercent:100,duration:.26,ease:'power2.in'},panel:{xPercent:100,duration:.26,ease:'power2.in'},modal:{autoAlpha:0,scale:.97,y:8,duration:.18,ease:'power2.in'}};
function Overlay({S,mobile,title,kind='panel',children,footer,onClose}){
  const cls=mobile?'sheet':kind;
  const root=useRef(null);const leaving=useRef(false);
  const done=onClose||S.rawClose;
  const close=()=>{if(leaving.current)return;if(!G||RM()||!root.current){done();return}leaving.current=true;
    let fired=false;const finish=()=>{if(!fired){fired=true;done()}};setTimeout(finish,500);
    try{G.timeline({onComplete:finish}).to(root.current.querySelector('.scrim'),{autoAlpha:0,duration:.22},0).to(root.current.querySelector('.'+cls),SHEET_OUT[cls],0)}catch(e){finish()}};
  useLayoutEffect(()=>{S.closerRef.current=close;let ctx;
    if(G&&!RM()&&root.current){try{ctx=G.context(()=>{G.from('.scrim',{autoAlpha:0,duration:.25});G.from('.'+cls,SHEET_IN[cls])},root)}catch(e){}}
    return()=>{if(S.closerRef.current===close)S.closerRef.current=null;if(ctx)ctx.revert()}},[]);
  useEffect(()=>{const k=e=>{if(e.key==='Escape')close()};window.addEventListener('keydown',k);return()=>window.removeEventListener('keydown',k)},[]);
  return html`<div ref=${root} className="ov" role="dialog" aria-modal="true" aria-label=${title}>
    <div className="scrim" onClick=${close}></div>
    <div className=${cls}>
      ${mobile&&html`<div className="grab" aria-hidden="true"></div>`}
      <div className="sheet-h"><h2 className="h2">${title}</h2><button className="ibtn" aria-label="Close" onClick=${close}><${Icon} n="x"/></button></div>
      <div className="sheet-b">${children}</div>
      ${footer&&html`<div className="sheet-f">${footer}</div>`}
    </div>
  </div>`;
}
function TaskEditor({S,mobile}){
  const sh=S.sheet;
  const base={kind:'flex',title:'',notes:'',cat:'personal',dur:30,day:0,repeat:false,pri:2,goal:null,ms:null,days:[0],start:1080,end:1140,remind:null,nudge:false,time:1020,lead:S.settings.defLead,leave:false,nag:S.settings.nNag};
  const [f,setF]=useState(()=>{
    if(sh.id){const t=S.tasks.find(x=>x.id===sh.id);return{...base,kind:'flex',title:t.title,notes:t.notes||'',cat:t.cat,dur:t.dur,day:t.day,repeat:!!t.repeat,pri:t.pri||2,goal:t.goal,ms:t.ms,nudge:!!t.nudge,days:[t.day>=0&&t.day!=null?t.day:0],start:t.time??1080,end:(t.time??1080)+t.dur,time:t.time??1020}}
    if(sh.fid){const x=S.fixed.find(y=>y.id===sh.fid);return{...base,kind:'fixed',title:x.title,notes:x.where||'',cat:x.cat,dur:x.end-x.start,day:x.days[0],days:x.days,start:x.start,end:x.end,remind:x.remind??null,time:x.start}}
    if(sh.rid){const r=S.reminders.find(y=>y.id===sh.rid);return{...base,kind:'rem',title:r.title,notes:r.note||'',cat:r.cat||'personal',days:r.days,time:r.time,lead:r.lead,leave:!!r.leave,nag:!!r.nag,day:r.days[0]}}
    const d=sh.defaults||{};return{...base,...d,days:[d.day!=null&&d.day>=0?d.day:0]};
  });
  const set=p=>setF(o=>({...o,...p}));
  const orig=sh.id?'flex':sh.fid?'fixed':sh.rid?'rem':null;const editing=!!orig;const same=orig===f.kind;
  const removeOrig=()=>{if(sh.id)S.removeTask(sh.id);if(sh.fid)S.setFixed(fx=>fx.filter(x=>x.id!==sh.fid));if(sh.rid)S.setReminders(rs=>rs.filter(x=>x.id!==sh.rid))};
  const save=()=>{
    if(f.kind==='flex'){
      const goalMs=f.goal?(f.ms&&S.goals.find(g=>g.id===f.goal).ms.some(m=>m.id===f.ms)?f.ms:goalInfo(S,S.goals.find(g=>g.id===f.goal)).next?.id||null):null;
      const p={title:f.title.trim(),notes:f.notes,cat:f.cat,dur:f.dur,day:f.day,repeat:f.repeat,pri:f.pri,goal:f.goal,ms:goalMs,nudge:f.nudge};
      if(same)S.update(sh.id,f.day!==S.tasks.find(x=>x.id===sh.id).day?{...p,time:null}:p);
      else{removeOrig();S.addTask(p)}
      S.toast(same?'Saved.':f.day==null?'Added to your brain dump.':`Added to ${dayWord(f.day)==='Today'?'today':dayWord(f.day)}.`);
    }else if(f.kind==='fixed'){
      const obj={title:f.title.trim(),cat:f.cat,days:f.days.length?f.days:[0],start:f.start,end:Math.max(f.end,f.start+15),where:f.notes,remind:f.remind};
      if(same)S.setFixed(fx=>fx.map(x=>x.id===sh.fid?{...x,...obj}:x));
      else{removeOrig();S.setFixed(fx=>[...fx,{id:'f'+Date.now(),...obj}])}
      S.toast(`Fixed: ${daysLabel(obj.days)}, ${fmtT(obj.start)}–${fmtT(obj.end)}.`);
    }else{
      const obj={title:f.title.trim(),cat:f.cat,days:f.days.length?f.days:[0],time:f.time,lead:f.lead,leave:f.leave,note:f.notes,nag:f.nag};
      if(same)S.setReminders(rs=>rs.map(x=>x.id===sh.rid?{...x,...obj,snooze:{}}:x));
      else{removeOrig();S.addReminder(obj)}
      S.toast(`Reminder set: ${daysLabel(obj.days)} at ${fmtT(obj.time-obj.lead)}.`);
    }
    S.close();
  };
  const del=()=>{removeOrig();S.toast('Deleted.');S.close()};
  const whenOpts=[0,1,2,3,4,5,6].map(d=>[d,d===0?'Today':d===1?'Tomorrow':`${DAYS[d]} ${dayDate(0,d).getDate()}`]);
  const dayPick=html`<div className="dayck" style=${cs(f.cat)}>${DAYS.map((dn,d)=>html`<button key=${d} className=${f.days.includes(d)?'on':''} aria-pressed=${f.days.includes(d)} onClick=${()=>set({days:f.days.includes(d)?f.days.filter(x=>x!==d):[...f.days,d]})} style=${{width:42,height:36}}>${dn}</button>`)}</div>`;
  const at=f.time-f.lead;
  const cuts=f.kind==='rem'&&f.leave?f.days.map(d=>fixedOn(S.fixed,d).find(x=>at>x.start&&at<x.end)).filter(Boolean):[];
  const help={flex:'Do it whenever there’s time. Dayli won’t pin it to a clock unless you do.',fixed:'Has an exact time, like a class, a shift, or a booked session.',rem:'A small thing you mustn’t forget. Dayli nudges you at the right moment.'}[f.kind];
  const body=html`
    <input id="te-title" className="input title" value=${f.title} onChange=${e=>set({title:e.target.value})} placeholder=${f.kind==='rem'?'What should I remind you about?':'What do you want to do?'} aria-label="Title" autoFocus=${!editing}/>
    <div className="field"><span className="label">Type</span>
      <${Seg} full=${true} label="Type" value=${f.kind} onChange=${v=>set({kind:v})} options=${[['flex','Flexible','sparkle'],['fixed','Fixed','lock'],['rem','Reminder','bell']]}/>

function PlaceSheet({S,mobile}){

  const components=html`

      <div className="ds-box"><span className="label">Navigation & bottom sheet</span><div className="mini-phone"><div className="sheet" style=${{borderRadius:'22px 22px 0 0',bottom:74,height:150}}><div className="grab"></div><div className="sheet-h" style=${{padding:'8px 16px'}}><span className="h2" style=${{fontSize:19}}>New task</span><span className="ibtn sm"><${Icon} n="x" s=${16}/></span></div></div><nav className="m-nav" style=${{gridTemplateColumns:'repeat(5,1fr)'}}><button className="on"><${Icon} n="sun" s=${20}/>Today</button><button><${Icon} n="cal" s=${20}/>Calendar</button><span className="add" style=${{width:44,height:44,display:'grid',placeItems:'center'}}><${Icon} n="plus" s=${22}/></span><button><${Icon} n="list" s=${20}/>Tasks</button><button><${Icon} n="dots" s=${20}/>More</button></nav></div><p className="small muted">Mobile: floating bottom bar, Add in the centre, sheets rise from the bottom. Desktop: sidebar, side panel for task editing, centred modal for short choices.</p></div>

  const notes=html`
    <section className="ds-sec"><h2 className="h2">Reusable components</h2><div className="comp-list">${[
      ['AppShell','Phone app or desktop app around every screen'],['Sidebar / MobileNav','Desktop sidebar; 5-item mobile bar with centre Add'],['Wordmark','Dayli in italic serif with a rose dot'],['Icon','Single outline set, 24px grid'],
      ['Button / IconButton','primary · secondary · soft · ghost · danger; sm · md · lg'],['Field / Input / TitleInput','Labelled inputs, time and date fields'],['Chip / CategoryChip','Filters, durations, days, categories'],['Segmented','Two to three exclusive views'],
      ['Toggle / Checkbox','Checkbox carries the completion burst'],['Tag / Dot','Category colour pairs'],['TaskRow','Checklist row with meta and move'],['StickyNote','Flexible task as paper; rotation varies'],
      ['FixedRow','Fixed commitment in lists'],['FlexCard','Tray card; draggable on desktop'],['QuickAdd','One-line capture for any section'],['Timeline','Visual day: fixed, placed, open gaps, now'],
      ['WeekGrid','7-day grid with load bars and drag targets'],['MonthGrid','Month with fixed pills and task dots'],['DayStrip','Mobile day picker with load dots'],['DayPanel','Free / planned / load and the flexible tray'],
      ['LoadPill / LoadBar','Light, Balanced, Full, Over capacity'],['ProgressRing / ProgressBar','Day and goal progress'],['ChapterCard / ChapterCover','Chapter summary and detail header'],['MilestoneTimeline','Done, current, upcoming nodes with steps'],
      ['Overlay','Bottom sheet · side panel · modal, one API'],['TaskEditor','Add / edit for flexible and fixed'],['MoveSheet / PlaceSheet','Change day; pick an open time'],['EmptyState','Paper stack, title, one line, optional action'],['Toast','Short confirmation in plain words'],['RemRow / DontForget','Today’s reminders with time, heads-up, Next and Missed states'],['NotificationBanner','How a reminder arrives: Done or Snooze 10 min'],['parseReminder','“Remind me at 4 to…” typed anywhere becomes a reminder'],['MorningPlan','Today’s plan to approve: summary, tasks, capacity check, Looks good'],['RolloverSheet','Where unfinished tasks will move tonight, and why'],['SettingsGroup / Row / PlanCard','Grouped settings and subscription']
    ].map(([n,d])=>html`<div key=${n}><b>${n}</b>${d}</div>`)}</div></section>
    <section className="ds-sec"><h2 className="h2">Key UX decisions</h2><ul className="notes">
      <li><b>Two kinds of time look different everywhere.</b> Fixed commitments are solid pastel blocks with a lock. Flexible tasks are paper notes. A flexible task placed at a time keeps a dashed outline, so you can tell it can still move.</li>
      <li><b>Flexible tasks belong to a day, not a clock.</b> Placing one at a time is optional, suggested only into open stretches long enough for it, and reversible with “Keep it flexible”.</li>
      <li><b>Free time is the page itself.</b> White paper inside your waking hours is available; tinted areas are outside your day. On Visual Day, gaps of 30 minutes or more become tappable “Open” slots.</li>
      <li><b>Capacity is honest and simple.</b> Free time = your day window − fixed hours − breathing room (a setting). Load is named in words: Light, Balanced, Full, Over capacity.</li>
      <li><b>Onboarding is a conversation with a review step.</b> One big question, four ways to answer, and a screen that shows what Dayli heard before anything is saved. Conflicts come with a one-tap fix.</li>
      <li><b>Goals count steps, not pressure.</b> Milestones have soft dates, progress reads “3 of 9 steps done”, and weeks with nothing linked are called normal.</li>
      <li><b>Chapters frame everything.</b> Goals, weekly rhythm and the countdown live under the current chapter, which is always one tap away.</li>
      <li><b>Reminders are the third kind of thing.</b> Small, time-anchored duties (a school pickup, a call, vitamins) get their own row on Today, a bell on the timeline and a real alert. A “time to leave” reminder ends any fixed block it falls inside, so leaving work at 16:00 really frees the evening and every load bar updates.</li>
      <li><b>Forgetting is planned for.</b> Reminders can repeat until ticked off, snooze in one tap, show as Missed instead of vanishing, and be typed in plain words (“remind me at 4 to leave for pickup”) wherever you add something.</li>
      <li><b>Dayli plans, the user approves.</b> Each morning the day arrives ready (leave time, tasks, reminders, a capacity check) and one tap approves it. Each night unfinished tasks move to the next day with room. The aim is under a minute of planning a day.</li>
      <li><b>Brain dump has no date on purpose.</b> Capture first, plan later; from there a note can go to any day or into an open slot.</li>
      <li><b>One model, two layouts.</b> Mobile uses a bottom bar with a central Add and bottom sheets; desktop uses a sidebar, side panel and drag-and-drop on the week grid. Goals and Chapters move to “More” on mobile.</li>
    </ul></section>
    <section className="ds-sec"><h2 className="h2">Open product questions</h2><ul className="notes">
      <li>Should unfinished flexible tasks roll over automatically, or should the morning plan ask?</li>
      <li>Is a weekly frequency (“gym 4×”) a quota that generates tasks, or a target that tasks count toward?</li>
      <li>Do fixed activities like Pilates count toward a flexible frequency target? The prototype asks during onboarding.</li>
      <li>Should capacity consider energy (tired after work), not only minutes?</li>
      <li>Can two chapters overlap, for example a semester and a fitness journey?</li>
      <li>For voice notes: always show the transcript for editing, or go straight to the review?</li>
      <li>Which external calendars sync in Phase 2, and are synced events always fixed and read-only?</li>
      <li>Which features are Plus: voice, import, smart spreading, sync, chapter history?</li>
      <li>How gentle is a gentle nudge? Per task, per category, or only when a free stretch appears?</li>
      <li>Week start, 12/24-hour time and date formats by region.</li>
      <li>Should a “time to leave” reminder use live travel time (traffic, distance), or a fixed buffer the user sets?</li>
      <li>Can reminders be shared, for example both parents seeing the school pickup and who is doing it today?</li>
      <li>Rollover: should a task that has rolled three times ask whether it still matters, or quietly drop to the brain dump?</li>
      <li>Location-based reminders (“when I leave the office”) need background location; worth it for Phase 2 or later?</li>
    </ul></section>
    <section className="ds-sec"><h2 className="h2">How to review this prototype</h2><ul className="notes">
      <li>Use the top bar to switch between <b>Phone</b>, <b>Desktop</b> and this <b>Design system</b>. The screen menu jumps straight to any screen; state is shared between phone and desktop.</li>
      <li>Start at Welcome → Get started → “Use an example” → Build my week. On the review, try “Count Pilates as one”, Edit routine, then Approve plan.</li>
      <li>On Today, tick a task, switch Visual day / Checklist, tap an Open slot to fit a task into it.</li>
      <li>On Calendar (desktop), drag a card from the right panel onto the grid to place it, or onto a day header to move it. On phone, use the move and clock buttons.</li>
      <li>Change “Breathing room” in Settings and watch every load bar update.</li>
    </ul>
    <p className="muted" style=${{maxWidth:'70ch'}}>Running it locally: the prototype is one self-contained HTML file with React loaded from a CDN, so there is no install or build. Open the file in a browser, or serve the folder with any static server:</p>
    <div className="code">npx serve .</div>
    <p className="muted" style=${{maxWidth:'70ch'}}>For Phase 2, each component above maps to a React component in a Next.js + Tailwind app, and the CSS custom properties map directly to Tailwind theme tokens.</p></section>`;
  return html`<div className="ds">
    <header className="ds-head"><${Wordmark} size=${32}/><h1 className="h1" style=${{fontSize:'clamp(30px,5vw,44px)'}}>Dayli design system</h1><p className="lede">A planner that feels like paper: solid colour for what's fixed, sticky notes for what can move, and plenty of white space for the time that's still yours.</p></header>
    <div className="ds-tabs"><${Seg} label="Design system sections" value=${tab} onChange=${setTab} options=${[['foundations','Foundations'],['components','Components'],['notes','Notes & questions']]}/></div>

  </div>`;
}

/* ================= prototype shell ================= */
function useSize(ref){const [s,setS]=useState({w:0,h:0});useLayoutEffect(()=>{if(!ref.current)return;const ro=new ResizeObserver(([e])=>setS({w:e.contentRect.width,h:e.contentRect.height}));ro.observe(ref.current);return()=>ro.disconnect()},[]);return s}
function TabletFrame({S,size}){
  const W=834,H=1112,B=14;const scale=Math.min(1,(size.w)/(W+2*B),(size.h)/(H+2*B));
  return html`<div className="dwrap" style=${{width:(W+2*B)*scale,height:(H+2*B)*scale}}><div className="tablet" style=${{width:W+2*B,height:H+2*B,transform:`scale(${scale})`}}>
    <div className="tablet-screen"><${App} S=${S} device="desktop"/></div></div></div>`;
}
function DesktopFrame({S,size}){
  const BW=1280;const avW=Math.max(size.w,300),avH=Math.max(size.h,300);
  const scale=Math.min(1,avW/BW);const w=avW>=BW?Math.min(avW,1480):BW;const h=Math.max(560,avH/scale);
  return html`<div className="dwrap" style=${{width:w*scale,height:h*scale}}><div className="dframe" style=${{width:w,height:h,transform:`scale(${scale})`}}>
    <div className="dframe-top" aria-hidden="true"><i></i><i></i><i></i><span className="dframe-url">dayli.app/${FLOW.includes(S.screen)?'start':S.screen}</span></div>
    <div className="dframe-body"><${App} S=${S} device="desktop"/></div></div></div>`;
}
const JUMP=[['welcome','1 · Welcome'],['onboarding','2 · Onboarding'],['routine','3 · Generated routine'],['today','4 · Today'],['calendar','5 · Weekly calendar'],['tasks','6 · Tasks'],['chapters','7 · Life chapters'],['chapter','7b · Chapter detail'],['goals','8 · Goals & milestones'],['add','9 · Add / edit task'],['settings','10 · Settings']];
function Shell(){
  const S=useStore();
  const [view,setView]=useState('phone');
  const stageRef=useRef(null);const size=useSize(stageRef);
  const [ww,setWw]=useState(typeof window!=='undefined'?window.innerWidth:1200);
  useEffect(()=>{const r=()=>setWw(window.innerWidth);window.addEventListener('resize',r);return()=>window.removeEventListener('resize',r)},[]);
  const narrow=ww<720;
  const jump=v=>{if(v==='add'){if(FLOW.includes(S.screen))S.setScreen('today');setTimeout(()=>S.openNew({day:0}),0);return}if(v==='routine'){S.setRoutine(parseRoutine(EXAMPLE))}S.setScreen(v)};
  const cur=S.sheet&&S.sheet.type==='task'?'add':S.screen==='generating'?'onboarding':S.screen;
  return html`<div className="shell">
    <header className="bar">
      <${Wordmark} size=${24}/><span className="proto">Phase 1 · design prototype</span>
      <div className="bar-r">
        <${Seg} label="Prototype view" value=${view} onChange=${setView} options=${[['phone','Phone','phone'],['tablet','Tablet','tablet'],['desktop','Desktop','monitor'],['system','System','layers']]}/>
        ${view!=='system'&&html`<span className="selwrap"><select aria-label="Jump to screen" value=${cur} onChange=${e=>jump(e.target.value)}>${JUMP.map(([v,l])=>html`<option key=${v} value=${v}>${l}</option>`)}</select><${Icon} n="chevD" s=${15}/></span>`}
      </div>
    </header>
    <main className=${cx('stage',view==='system'&&'sys',view==='phone'&&narrow&&'bare')} ref=${stageRef}>
      ${view==='system'?html`<${DesignSystem} S=${S}/>`
        :view==='phone'?(narrow?html`<div className="bare-app"><${App} S=${S} device="mobile"/></div>`
          :html`<div className="phone"><div className="island" aria-hidden="true"></div><div className="phone-screen"><${App} S=${S} device="mobile" framed=${true}/></div><div className="home-ind" aria-hidden="true"></div></div>`)
        :view==='tablet'?(size.w>0&&html`<${TabletFrame} S=${S} size=${{w:size.w-(narrow?32:48),h:size.h-44}}/>`)
        :size.w>0&&html`<${DesktopFrame} S=${S} size=${{w:size.w-(narrow?32:48),h:size.h-44}}/>`}
    </main>
  </div>`;
}
if(typeof document!=='undefined'&&document.getElementById('root')&&!window.__DAYLI_TEST__){ReactDOM.createRoot(document.getElementById('root')).render(html`<${Shell}/>`)}
</script>
