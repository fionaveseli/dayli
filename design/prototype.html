<title>Dayli Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: prototype shell (top bar + stage) holding the Dayli app in a phone frame or desktop window. Paper-and-stationery identity: solid pastel = fixed, paper notes = flexible.
   Style: tasteskill "editorial-greeting" app style with the brand palette and type kept. Desktop shell = tinted L-frame (sidebar on --paper-2) with the page on a sheet inset 8px.
   Two faces: Newsreader for page titles, chapter names and the wordmark only; Figtree for everything else. Colour on data and status; chrome stays neutral. Motion = feedback (GSAP). */
:root{
  --paper:#FAF7F4; --paper-2:#F3EEE9; --card:#FFFFFF; --shell:#EEE8E2; --frame:#1E2026;
  --ink:#20242C; --ink-2:#4B4F58; --muted:#63666D; --faint:#6B6C72;
  --line:#EAE4E0; --line-2:#DBD3CD;
  --rose:#C25E88; --rose-soft:#F8E5EC; --sel:#FDF5F8;
  --blush:#F5DCE6; --blush-ink:#9A4468;
  --powder:#DCE8F8; --powder-ink:#3A5E98;
  --sage:#DDEBDD; --sage-ink:#456E4A;
  --lav:#E8DDF6; --lav-ink:#684C9E;
  --peach:#F9E6D6; --peach-ink:#9C592B;
  --butter:#F4EBC8; --butter-ink:#7C6318;
  --warn:#A3601C; --warn-bg:#FAEAD7; --over:#AE3F4E; --over-bg:#F8DFE2;
  --btn:#20242C; --btn-ink:#FAF7F4; --nav-bg:rgba(255,255,255,.86);
  --sh-1:0 1px 2px rgba(48,34,34,.05),0 2px 10px rgba(48,34,34,.04);
  --sh-2:0 14px 34px -12px rgba(48,34,34,.2);
  --sh-note:0 1px 2px rgba(48,34,34,.06);
  --sh-pop:0 30px 70px -24px rgba(30,22,22,.38);
  --scrim:rgba(32,36,44,.3);
  --f-display:"Newsreader",Georgia,"Times New Roman",serif;
  --f-ui:"Figtree",-apple-system,"Segoe UI",system-ui,sans-serif;
  --active:#ECE6E1;
  --r-xs:6px; --r-sm:10px; --r-md:14px; --r-lg:16px; --r-xl:24px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#17181C; --paper-2:#1D1E23; --card:#23252B; --shell:#0F1013; --frame:#2A2C33;
  --ink:#F3EEE9; --ink-2:#CFC9C3; --muted:#9A9BA2; --faint:#8A8B92;
  --line:#2D2F36; --line-2:#3B3D45;
  --rose:#E48DB1; --rose-soft:#3A2630; --sel:#241E23;
  --blush:#3B2631; --blush-ink:#F1B5CD;
  --powder:#22304A; --powder-ink:#A9C5F1;
  --sage:#22332A; --sage-ink:#A8D3AD;
  --lav:#2E2741; --lav-ink:#CDB9F2;
  --peach:#3A2B21; --peach-ink:#F1C39E;
  --butter:#352F1B; --butter-ink:#E9D58D;
  --warn:#EDB070; --warn-bg:#3A2B1B; --over:#F09AA5; --over-bg:#3E2329;
  --btn:#F3EEE9; --btn-ink:#17181C; --nav-bg:rgba(35,37,43,.86);
  --sh-1:0 1px 2px rgba(0,0,0,.3);
  --sh-2:0 14px 34px -12px rgba(0,0,0,.6);
  --sh-note:0 1px 2px rgba(0,0,0,.3);
  --active:#2C2E35;
  --sh-pop:0 30px 70px -20px rgba(0,0,0,.75);
  --scrim:rgba(0,0,0,.5);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#17181C; --paper-2:#1D1E23; --card:#23252B; --shell:#0F1013; --frame:#2A2C33;
  --ink:#F3EEE9; --ink-2:#CFC9C3; --muted:#9A9BA2; --faint:#8A8B92;
  --line:#2D2F36; --line-2:#3B3D45;
  --rose:#E48DB1; --rose-soft:#3A2630; --sel:#241E23;
  --blush:#3B2631; --blush-ink:#F1B5CD;
  --powder:#22304A; --powder-ink:#A9C5F1;
  --sage:#22332A; --sage-ink:#A8D3AD;
  --lav:#2E2741; --lav-ink:#CDB9F2;
  --peach:#3A2B21; --peach-ink:#F1C39E;
  --butter:#352F1B; --butter-ink:#E9D58D;
  --warn:#EDB070; --warn-bg:#3A2B1B; --over:#F09AA5; --over-bg:#3E2329;
  --btn:#F3EEE9; --btn-ink:#17181C; --nav-bg:rgba(35,37,43,.86);
  --sh-1:0 1px 2px rgba(0,0,0,.3);
  --sh-2:0 14px 34px -12px rgba(0,0,0,.6);
  --sh-note:0 1px 2px rgba(0,0,0,.3);
  --active:#2C2E35;
  --sh-pop:0 30px 70px -20px rgba(0,0,0,.75);
  --scrim:rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body,#root{height:100%}
body{margin:0;background:var(--shell);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
h1,h2,h3,p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px} .tnum{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px} .row.wrap{flex-wrap:wrap} .grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}

/* ---------- shell ---------- */
.shell{height:100%;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--paper);position:relative;z-index:5}
.bar .proto{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.02em}
.bar-r{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.selwrap{position:relative;display:inline-flex;align-items:center}
.selwrap select{appearance:none;-webkit-appearance:none;height:36px;border-radius:999px;border:1px solid var(--line-2);background:var(--card);padding:0 34px 0 14px;font-size:13.5px;font-weight:600;color:var(--ink);cursor:pointer}
.selwrap svg{position:absolute;right:11px;pointer-events:none;color:var(--muted)}
.stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding-block:22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:hidden}
.stage.bare{padding:0;align-items:stretch}
.stage.sys{display:block;overflow-y:auto;padding:0}
.bare-app{width:100%;height:100%}
.phone{height:100%;max-height:868px;aspect-ratio:390/844;max-width:100%;border-radius:54px;padding:11px;background:var(--frame);box-shadow:var(--sh-pop),inset 0 0 0 1.5px rgba(255,255,255,.07);position:relative;flex-shrink:0}
.phone-screen{height:100%;border-radius:44px;overflow:hidden;position:relative;background:var(--paper);isolation:isolate}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:112px;height:32px;border-radius:20px;background:#0b0b0d;z-index:90}
.statusbar{height:52px;display:flex;align-items:center;justify-content:space-between;padding:6px 32px 0 36px;font-weight:600;font-size:15px;flex-shrink:0}
.statusbar .si{display:flex;gap:6px;align-items:center}
.home-ind{position:absolute;bottom:8px;left:50%;width:134px;height:5px;border-radius:3px;background:var(--ink);opacity:.8;transform:translateX(-50%);z-index:90}
.dwrap{position:relative;flex-shrink:0}
.dframe{position:absolute;top:0;left:0;transform-origin:0 0;border-radius:14px;overflow:hidden;box-shadow:var(--sh-pop);background:var(--paper);display:flex;flex-direction:column;border:1px solid var(--line)}
.dframe-top{height:40px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 14px;background:var(--paper-2);border-bottom:1px solid var(--line)}
.dframe-top i{width:11px;height:11px;border-radius:50%;background:var(--line-2)}
.dframe-url{margin:0 auto;height:24px;padding:0 60px;border-radius:7px;background:var(--card);border:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;align-items:center}
.dframe-body{flex:1;min-height:0}
.tablet{position:absolute;top:0;left:0;transform-origin:0 0;border-radius:38px;padding:14px;background:var(--frame);box-shadow:var(--sh-pop)}
.tablet-screen{width:100%;height:100%;border-radius:24px;overflow:hidden;background:var(--paper)}

/* ---------- type ---------- */
.wordmark{font-family:var(--f-display);font-weight:500;font-style:italic;letter-spacing:-.02em;line-height:1;color:var(--ink)}
.wordmark i{color:var(--rose)}
.subline{font-size:14.5px;color:var(--muted);margin-top:6px;line-height:1.45}
.h1{font-family:var(--f-display);font-weight:500;font-size:28px;line-height:1.12;letter-spacing:-.01em;text-wrap:balance}
.h2{font-weight:650;font-size:18px;line-height:1.25;text-wrap:balance}
.ch-card .h2,.ch-cover .h2,.side-ch .h3{font-family:var(--f-display);font-weight:500;letter-spacing:-.01em}
.h3{font-size:15.5px;font-weight:650;line-height:1.3}
.hand{font-size:14px;line-height:1.45;color:var(--muted)}
.d-app .h1{font-size:30px}
.sec{margin-top:28px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:4px 12px;margin-bottom:12px;flex-wrap:wrap}
.sec-h .h3{display:flex;align-items:center;gap:8px}
.lede{color:var(--ink-2);margin-top:8px;max-width:60ch}

/* ---------- buttons, fields, chips ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:999px;font-weight:600;font-size:14.5px;transition:transform .15s,background .15s,opacity .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--btn);color:var(--btn-ink)}
.btn.secondary{background:var(--card);border:1px solid var(--line-2)}
.btn.secondary:hover{border-color:var(--ink-2)}
.btn.soft{background:var(--rose-soft);color:var(--blush-ink)}
.btn.ghost{color:var(--ink-2)} .btn.ghost:hover{background:var(--paper-2)}
.btn.danger{color:var(--over)} .btn.danger:hover{background:var(--over-bg)}
.btn.lg{height:54px;padding:0 26px;font-size:16px}
.btn.sm{height:34px;padding:0 13px;font-size:13.5px;gap:6px}
.btn.block{width:100%}
.btn:disabled{opacity:.35;pointer-events:none}
.ibtn{width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;color:var(--ink-2);flex-shrink:0;transition:background .15s}
.ibtn:hover{background:var(--paper-2)} .ibtn.sm{width:32px;height:32px}
.field{display:flex;flex-direction:column;gap:7px}
.label{font-size:13px;font-weight:600;color:var(--ink-2)}
.input{height:46px;width:100%;border-radius:var(--r-md);border:1px solid var(--line-2);background:var(--card);padding:0 14px;outline:none;transition:border-color .15s,box-shadow .15s}
.input:focus{border-color:var(--ink-2);box-shadow:0 0 0 3px var(--rose-soft)}
textarea.input{height:auto;padding:12px 14px;resize:vertical;min-height:84px;line-height:1.5}
.input.title{font-family:var(--f-display);font-size:22px;height:54px;border:0;border-bottom:1px solid var(--line-2);border-radius:0;background:transparent;padding:0 2px}
.input.title:focus{box-shadow:none;border-color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--card);font-size:13.5px;font-weight:550;white-space:nowrap;flex-shrink:0;transition:background .15s,border-color .15s}
.chip:hover{border-color:var(--ink-2)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.cat.on{background:var(--c);color:var(--ci);border-color:var(--ci)}
.chip .n{font-size:12px;opacity:.6;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:2px 20px}
.chips.scroll::-webkit-scrollbar{display:none}
.d-app .chips.scroll{margin:0;padding:2px 0;flex-wrap:wrap;overflow:visible}
.seg{display:inline-flex;background:var(--paper-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{height:32px;padding:0 14px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px;justify-content:center;transition:background .15s,color .15s}
.seg button.on{background:var(--card);color:var(--ink)}
.seg.full{display:flex} .seg.full button{flex:1}
.tag{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;background:var(--c);color:var(--ci);font-size:12px;font-weight:600;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ci);flex-shrink:0;display:inline-block}
.toggle{width:46px;height:28px;border-radius:999px;background:var(--line-2);position:relative;flex-shrink:0;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.toggle.on{background:var(--ink)} .toggle.on::after{transform:translateX(18px)}
.lpill{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:650;white-space:nowrap}
.lpill.light,.lpill.balanced{background:var(--paper-2);color:var(--ink-2)}
.lpill.full{background:var(--warn-bg);color:var(--warn)}
.lpill.over{background:var(--over-bg);color:var(--over)}
.lbar{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.lbar i{display:block;height:100%;border-radius:3px;transition:width .4s}
.lbar i.light{background:var(--faint)} .lbar i.balanced{background:var(--ink-2)} .lbar i.full{background:var(--warn)} .lbar i.over{background:var(--over)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px}

/* ---------- checkbox + completion ---------- */
.chk{width:26px;height:26px;flex-shrink:0;border-radius:50%;border:1.7px solid var(--line-2);background:var(--card);display:grid;place-items:center;position:relative;transition:background .2s,border-color .2s}
.chk:hover{border-color:var(--ink-2)}
.chk svg{width:15px;height:15px;stroke:var(--btn-ink);stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset .3s .05s}
.chk.on{background:var(--btn);border-color:var(--btn)}
.chk.on svg{stroke-dashoffset:0}
.chk.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.burst{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none}
.burst i{position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;animation:burst .7s ease-out forwards}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes burst{0%{transform:rotate(var(--a)) translateX(6px);opacity:1}100%{transform:rotate(var(--a)) translateX(24px);opacity:0}}

/* ---------- task rows + notes ---------- */
.list{display:flex;flex-direction:column;gap:8px}
.trow{display:flex;align-items:center;gap:12px;padding:12px 10px 12px 14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);cursor:pointer;transition:opacity .35s,border-color .15s,transform .2s}
.trow:hover{border-color:var(--line-2)}
.trow .tt{font-weight:600;font-size:15px;line-height:1.3}
.trow.done{background:transparent}
.trow.done .tt{text-decoration:line-through;text-decoration-color:var(--faint);color:var(--muted);font-weight:500}
.meta{display:flex;gap:6px 10px;align-items:center;flex-wrap:wrap;margin-top:4px;font-size:12.5px;color:var(--muted)}
.meta .sep{width:3px;height:3px;border-radius:50%;background:var(--faint)}
.trow.just{animation:settle .6s}
@keyframes settle{0%{transform:scale(1)}30%{transform:scale(1.015)}100%{transform:scale(1)}}
.note{position:relative;background:var(--c);border-radius:5px 5px 16px 5px;padding:14px 14px 12px;box-shadow:var(--sh-note);transition:transform .2s;cursor:pointer;display:flex;flex-direction:column;gap:10px;min-height:118px;text-align:left}
.note::after{content:"";position:absolute;right:0;bottom:0;width:20px;height:20px;background:rgba(0,0,0,.07);clip-path:polygon(100% 0,0 100%,100% 100%);border-radius:0 0 16px 0}
.note:hover{transform:translateY(-2px)}
.note .nt{font-weight:650;font-size:15px;line-height:1.28;color:var(--ink)}
.note .nm{font-size:12.5px;color:var(--ci);font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.note.done{opacity:.55} .note.done .nt{text-decoration:line-through}
.note .nf{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:6px}
.note .ibtn{width:32px;height:32px;color:var(--ci)} .note .ibtn:hover{background:rgba(255,255,255,.45)}
.note-add{border:1.5px dashed var(--line-2);border-radius:5px 5px 16px 5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-weight:600;font-size:13.5px;min-height:118px}
.note-add:hover{border-color:var(--rose);color:var(--blush-ink)}
.tray{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:6px 20px 14px}
.tray::-webkit-scrollbar{display:none}
.tray > *{width:168px;flex-shrink:0}
.tray-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.fixrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-md);background:var(--c);cursor:pointer}
.fixrow .time{font-size:12.5px;font-weight:650;color:var(--ci);width:94px;flex-shrink:0;font-variant-numeric:tabular-nums}
.fixrow .ft{font-weight:600;color:var(--ink)} .fixrow .fw{font-size:12.5px;color:var(--ci)}
.fixrow svg{color:var(--ci);opacity:.7}
.fixrow > svg:last-child{margin-left:auto}
.rrow{display:flex;align-items:center;gap:12px;padding:11px 10px 11px 12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);cursor:pointer;transition:border-color .15s}
.rrow:hover{border-color:var(--line-2)}
.rrow.next{border-color:var(--rose)}
.rrow .rtime{font-weight:650;font-size:14px;width:44px;flex-shrink:0}
.rrow .tt{font-weight:600;font-size:14.5px;line-height:1.3}
.rrow.done .tt{text-decoration:line-through;text-decoration-color:var(--faint);color:var(--muted);font-weight:500}
.rrow.done .rtime{color:var(--muted)}
.rbell{width:26px;display:grid;place-items:center;color:var(--muted);flex-shrink:0}
.lpill.nextp{background:var(--rose-soft);color:var(--blush-ink)}
.tl-rem{position:absolute;right:8px;transform:translateY(-50%);z-index:7;display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;background:var(--card);border:1.5px solid var(--ink);font-size:12px;font-weight:600;max-width:72%;white-space:nowrap;overflow:hidden;color:var(--ink)}
.tl-rem .tr-t{overflow:hidden;text-overflow:ellipsis}
.tl-rem.leave{background:var(--ink);color:var(--paper)}
.tl-rem.done{opacity:.55;border-color:var(--line-2);background:var(--card);color:var(--muted)}
.wg-rem{position:absolute;left:2px;right:2px;height:0;border-top:2px solid var(--ink);z-index:5;pointer-events:none}
.wg-rem::before{content:"";position:absolute;left:-1px;top:-4px;width:6px;height:6px;border-radius:50%;background:var(--ink)}
.wg-rem.done{opacity:.35}
.wg.compact .wg-rem{display:none}
.plan-card{gap:12px;padding:18px;border-radius:var(--r-lg);background:var(--card);border:1.5px solid var(--rose)}
.d-app .plan-card .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.prow{display:flex;align-items:center;gap:12px;padding:8px 6px 8px 12px;border-radius:12px;background:var(--paper-2)}
.plan-done{gap:10px;padding:10px 8px 10px 14px;border-radius:var(--r-md);background:var(--sage);color:var(--sage-ink)}
.plan-done .btn{color:var(--sage-ink)}
.linkish{margin-top:8px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-2);text-align:left}
.linkish:hover{color:var(--ink)}
.banner{position:absolute;top:10px;left:10px;right:10px;z-index:85;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:var(--sh-2)}
.framed .banner{top:54px}
.d-app .banner{left:auto;right:20px;top:20px;width:380px}
.bmark{width:36px;height:36px;border-radius:10px;background:var(--btn);color:var(--btn-ink);display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-style:italic;font-size:19px;flex-shrink:0}
.bmark i{color:var(--rose)}
.qadd{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 14px;border-radius:var(--r-md);border:1.5px dashed var(--line-2);background:transparent}
.qadd:focus-within{border-style:solid;border-color:var(--ink-2);background:var(--card)}
.qadd input{flex:1;min-width:0;border:0;outline:none;background:transparent;height:38px}
.qadd svg{color:var(--muted)}

/* ---------- empty states ---------- */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:34px 16px}
.empty-art{position:relative;width:96px;height:74px;margin-bottom:6px}
.empty-art i{position:absolute;width:62px;height:56px;border-radius:4px 4px 12px 4px;box-shadow:var(--sh-note)}
.empty-art i:nth-child(1){left:6px;top:10px;background:var(--powder);transform:rotate(-8deg)}
.empty-art i:nth-child(2){left:30px;top:4px;background:var(--sage);transform:rotate(6deg)}
.empty-art i:nth-child(3){left:18px;top:16px;background:var(--blush);transform:rotate(-1deg)}
.empty .h2{font-size:21px}
.empty p{color:var(--muted);max-width:32ch;font-size:14px}

/* ---------- mobile app ---------- */
.m-app{position:relative;height:100%;display:flex;flex-direction:column;background:var(--paper);overflow:hidden}
.m-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:12px 20px 120px;scrollbar-width:none}
.m-scroll::-webkit-scrollbar{display:none}
.m-scroll.flow{padding-bottom:28px}
.bare-app .m-scroll{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.m-nav{position:absolute;left:0;right:0;bottom:0;height:72px;background:var(--paper);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;z-index:30}
.framed .m-nav{height:90px;padding-bottom:20px}
.bare-app .m-nav{padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.m-nav button{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
.m-nav button.on{color:var(--ink)}
.m-nav .add{width:50px;height:50px;margin:auto;border-radius:50%;background:var(--btn);color:var(--btn-ink);transition:transform .15s}
.m-nav .add:active{transform:scale(.94)}
.m-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--blush);color:var(--blush-ink);font-family:var(--f-display);font-size:19px;display:grid;place-items:center;flex-shrink:0}
.flow-foot{position:sticky;bottom:0;margin:20px -20px -28px;padding:14px 20px 22px;background:var(--paper);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;z-index:4}
.framed .flow-foot{padding-bottom:34px}
@keyframes fadeUp{from{opacity:.55;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- desktop app ---------- */
.d-app{position:relative;height:100%;display:grid;grid-template-columns:232px minmax(0,1fr);background:var(--paper-2);overflow:hidden}
.d-app.flowmode{display:block;overflow-y:auto;background:var(--paper)}
.side{padding:24px 14px 18px;display:flex;flex-direction:column;gap:4px;background:var(--paper-2);min-height:0;overflow-y:auto}
.side .wordmark{font-size:30px;padding:0 10px 18px}
.wm-mini{display:none}
.side-nav{display:flex;flex-direction:column;gap:2px;margin-top:14px}
.side-nav button{display:flex;align-items:center;gap:12px;height:42px;padding:0 12px;border-radius:12px;font-weight:600;font-size:14.5px;color:var(--ink-2);transition:background .15s}
.side-nav button:hover{background:var(--active)}
.side-nav button.on{background:var(--active);color:var(--ink)}
.side-ch{margin-top:auto;padding:14px;border-radius:16px;background:var(--blush);text-align:left;display:flex;flex-direction:column;gap:6px}
.side-ch .h3{font-family:var(--f-display);font-weight:500;font-size:18px;color:var(--ink)}
.side-ch .small{color:var(--blush-ink)}
.d-main{overflow-y:auto;min-width:0;min-height:0;margin:8px 8px 8px 0;border:1px solid var(--line);border-radius:16px;background:var(--paper)}
.d-inner{padding:30px 40px 56px;max-width:1180px;margin:0 auto}
.d-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:26px}
.d-cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start}
.d-cols > *{min-width:0}
.d-app .toast{bottom:28px}

/* ---------- sheets ---------- */
.ov{position:absolute;inset:0;z-index:60;display:flex}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:relative;margin-top:auto;width:100%;max-height:93%;background:var(--paper);border-radius:28px 28px 0 0;box-shadow:var(--sh-pop);display:flex;flex-direction:column;will-change:transform}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line-2);margin:10px auto 0;flex-shrink:0}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px 6px;flex-shrink:0}
.sheet-h .h2{font-size:24px}
.sheet-b{overflow-y:auto;padding:8px 20px 22px;flex:1;min-height:0;display:flex;flex-direction:column;gap:20px}
.sheet-b > *{flex-shrink:0}
.sheet-f{padding:12px 20px 20px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;background:var(--paper);flex-shrink:0}
.framed .sheet-f{padding-bottom:32px}
.panel{position:relative;margin-left:auto;width:470px;max-width:100%;height:100%;background:var(--paper);box-shadow:var(--sh-pop);display:flex;flex-direction:column;will-change:transform;border-left:1px solid var(--line)}
.panel .sheet-h{padding:24px 26px 6px} .panel .sheet-b{padding:10px 26px 26px} .panel .sheet-f{padding:16px 26px}
.modal{position:relative;margin:auto;width:600px;max-width:calc(100% - 48px);max-height:88%;border-radius:26px;background:var(--paper);box-shadow:var(--sh-pop);display:flex;flex-direction:column;will-change:transform;overflow:hidden}
.modal .sheet-h{padding:24px 26px 6px} .modal .sheet-b{padding:10px 26px 26px} .modal .sheet-f{padding:16px 26px}
@keyframes fade{from{opacity:0}} @keyframes up{from{transform:translateY(100%)}} @keyframes slide{from{transform:translateX(100%)}} @keyframes zoom{from{opacity:0;transform:scale(.96) translateY(8px)}}
.opt{display:flex;align-items:center;gap:14px;padding:14px;border-radius:var(--r-md);background:var(--card);border:1px solid var(--line);width:100%;text-align:left;transition:border-color .15s}
.opt:hover{border-color:var(--ink-2)}
.opt.cur{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.toast{position:absolute;left:50%;bottom:98px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:16px;font-size:13.5px;font-weight:500;box-shadow:var(--sh-2);z-index:80;animation:toastIn .3s ease-out;width:max-content;max-width:calc(100% - 40px);text-align:center}
.framed .toast{bottom:104px}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}}

/* ---------- timeline (visual day) ---------- */
.tl{position:relative}
.tl-hour{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.tl-hour span{position:absolute;left:0;top:-8px;font-size:11px;font-weight:500;color:var(--faint);font-variant-numeric:tabular-nums;background:var(--paper);padding-right:6px;line-height:1}
.tl-track{position:absolute;left:50px;right:0;top:0;bottom:0}
.tl-sleep{position:absolute;left:50px;right:0;background:var(--paper-2);border-radius:10px;display:flex;align-items:flex-start;justify-content:flex-end;padding:6px 10px;font-size:11.5px;color:var(--muted)}
.blk{position:absolute;left:0;right:0;border-radius:12px;background:var(--c);padding:7px 11px;overflow:hidden;font-size:12.5px;line-height:1.25;display:flex;gap:10px;align-items:flex-start;text-align:left;cursor:pointer;transition:transform .15s}
.blk:hover{transform:translateX(2px)}
.blk .bt{font-weight:650;color:var(--ink);font-size:14px}
.blk .bm{color:var(--ci);font-size:12px;font-weight:550;margin-top:2px}
.blk .lock{margin-left:auto;color:var(--ci);opacity:.7;flex-shrink:0}
.blk.flex{background:var(--card);border:1.5px dashed var(--ci)}
.blk.flex.done{opacity:.55} .blk.flex.done .bt{text-decoration:line-through}
.blk.short{align-items:center;padding-block:3px}
.blk.short .bm{margin:0}
.gap{position:absolute;left:0;right:0;border-radius:12px;border:1.5px dashed var(--line-2);display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:12.5px;font-weight:550;padding:0 12px;transition:background .15s,border-color .15s,color .15s}
.gap .ga{display:inline-flex;align-items:center;gap:4px;opacity:0;transition:opacity .15s}
.gap:hover,.gap:focus-visible{background:var(--rose-soft);border-color:var(--rose);color:var(--blush-ink)}
.gap:hover .ga,.gap:focus-visible .ga{opacity:1}
.m-app .gap .ga{opacity:1}
.gap.past{opacity:.45}
.tl-now{position:absolute;left:42px;right:0;height:0;border-top:2px solid var(--rose);z-index:6;pointer-events:none}
.tl-now::before{content:"";position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--rose)}
.tl-now span{position:absolute;right:0;top:-20px;font-size:11px;font-weight:700;color:var(--rose)}

/* ---------- week grid ---------- */
.wg{--gut:46px}
.wg-head{display:grid;grid-template-columns:var(--gut) repeat(7,minmax(0,1fr));gap:0;margin-bottom:6px}
.wg-dh{padding:8px 4px 10px;text-align:center;border-radius:14px;transition:background .15s;min-width:0}
.wg-dh:hover{background:var(--paper-2)}
.wg-dh .dn{font-size:12px;color:var(--muted);font-weight:600}
.wg-dh .dd{font-size:20px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.wg-dh .lbar{width:62%;margin:6px auto 0}
.wg-dh.sel{background:var(--active)}
.wg-dh.today .dd{color:var(--rose)}
.wg-dh.drop{background:var(--rose-soft);box-shadow:0 0 0 2px var(--rose)}
.wg-body{display:grid;grid-template-columns:var(--gut) repeat(7,minmax(0,1fr));border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--paper-2)}
.wg-gut{position:relative;background:var(--paper)}
.wg-gut span{position:absolute;right:8px;font-size:10.5px;color:var(--faint);transform:translateY(-50%);font-variant-numeric:tabular-nums}
.wg-col{position:relative;border-left:1px solid var(--line);min-width:0}
.wg-awake{position:absolute;left:0;right:0;background:var(--card)}
.wg-col.sel .wg-awake{background:var(--sel)}
.wg-hl{position:absolute;left:0;right:0;border-top:1px solid var(--line);pointer-events:none}
.wg-col .blk{left:3px;right:3px;border-radius:9px;padding:5px 7px;font-size:11.5px;gap:4px;display:block}
.wg-col .blk .bt{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wg-col .blk .bm{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wg-col .blk.flex{border-width:1.5px}
.wg-free{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--faint);font-weight:550;pointer-events:none}
.wg-col.drop{box-shadow:inset 0 0 0 2px var(--rose)}
.wg.compact{--gut:30px}
.wg.compact .wg-dh{padding:6px 0 8px;border-radius:12px}
.wg.compact .wg-dh .dd{font-size:16px}
.wg.compact .wg-dh .dn{font-size:11px}
.wg.compact .wg-dh .lbar{height:4px;width:58%}
.wg.compact .wg-col .blk{left:2px;right:2px;border-radius:6px;padding:3px 3px}
.wg.compact .wg-col .blk .bt{display:none}
.wg.compact .wg-col .blk .bm{display:none}
.wg.compact .wg-gut span{right:5px;font-size:9.5px}
.wg-ghost{position:absolute;left:3px;right:3px;border-radius:9px;background:var(--rose-soft);border:1.5px dashed var(--rose);pointer-events:none;z-index:4}

/* ---------- month ---------- */
.mg-h{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:6px}
.mg-h span{text-align:center;font-size:12px;font-weight:600;color:var(--muted)}
.mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.mg-c{min-height:104px;border-radius:12px;background:var(--card);border:1px solid var(--line);padding:7px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0;transition:border-color .15s}
.mg-c:hover{border-color:var(--ink-2)}
.mg-c.out{opacity:.4}
.mg-c.sel{box-shadow:0 0 0 1.5px var(--ink)}
.mg-c .n{font-size:13px;font-weight:650;width:24px;height:24px;display:grid;place-items:center;border-radius:50%;font-variant-numeric:tabular-nums}
.mg-c.today .n{background:var(--rose);color:#fff}
.mg-ev{display:block;font-size:11px;font-weight:600;padding:2px 6px;border-radius:5px;background:var(--c);color:var(--ci);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mg-dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:auto}
.mg-dots i{width:7px;height:7px;border-radius:50%;background:var(--ci);border:1.5px solid var(--c)}
.m-app .mg{gap:4px} .m-app .mg-h{gap:4px}
.m-app .mg-c{min-height:62px;padding:5px 4px;border-radius:10px;align-items:center}
.m-app .mg-ev{height:4px;padding:0;width:100%}
.m-app .mg-c .n{font-size:12px;width:22px;height:22px}

/* ---------- day strip (mobile calendar) ---------- */
.dstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dstrip button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 9px;border-radius:14px;transition:background .15s}
.dstrip .dn{font-size:11.5px;font-weight:600;color:var(--muted)}
.dstrip .dd{font-size:17px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.dstrip button.sel{background:var(--btn);color:var(--btn-ink)}
.dstrip button.sel .dn{color:inherit;opacity:.7}
.dstrip button.today:not(.sel) .dd{color:var(--rose)}
.dstrip .ld{width:6px;height:6px;border-radius:50%;margin-top:2px}
.ld.light{background:var(--faint)} .ld.balanced{background:var(--ink-2)} .ld.full{background:var(--warn)} .ld.over{background:var(--over)} .ld.none{background:transparent}

/* ---------- calendar side + flex cards ---------- */
.fcard{display:flex;align-items:center;gap:10px;padding:10px 6px 10px 12px;border-radius:12px;background:var(--c);cursor:pointer;transition:transform .15s}
.fcard:hover{transform:translateY(-1px)}
.fcard[draggable="true"]{cursor:grab}
.fcard .ft{font-weight:620;font-size:14px;line-height:1.25;color:var(--ink)}
.fcard .fm{font-size:12px;color:var(--ci);font-weight:600;margin-top:2px}
.fcard.done{opacity:.55} .fcard.done .ft{text-decoration:line-through}
.fcard .ibtn{width:32px;height:32px;color:var(--ci)}
.fcard.placed{background:var(--card);border:1.5px dashed var(--ci);box-shadow:none}
.statrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{padding:10px 12px;border-radius:12px;background:var(--paper-2)}
.stat b{display:block;font-weight:600;font-size:19px;line-height:1.15;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);font-weight:550}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:16px;height:11px;border-radius:3px;display:inline-block}
.dropzone{border-radius:16px;transition:box-shadow .15s,background .15s}
.dropzone.drop{background:var(--rose-soft);box-shadow:0 0 0 2px var(--rose)}

/* ---------- progress ---------- */
.ring{position:relative;flex-shrink:0}
.ring svg{display:block;transform:rotate(-90deg)}
.ring .rt{position:absolute;inset:0;display:grid;place-items:center;font-weight:600;font-size:18px;font-variant-numeric:tabular-nums}
.pbar{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:999px;background:var(--ink);transition:width .5s}
.pcard{display:flex;align-items:center;gap:16px;padding:16px 18px;border-radius:var(--r-lg);background:var(--card);border:1px solid var(--line)}

/* ---------- welcome ---------- */
.welcome{min-height:100%;display:flex;flex-direction:column}
.welcome.m{padding-top:6px}
.w-notes{position:relative;height:300px;flex-shrink:0}
.w-note{position:absolute;width:150px;padding:12px 13px 14px;background:var(--c);border-radius:4px 4px 14px 4px;box-shadow:var(--sh-note);display:flex;flex-direction:column;gap:3px;will-change:transform}
.w-note b{font-weight:650;font-size:14.5px;color:var(--ink)}
.w-note span{font-size:12.5px;color:var(--ci);font-weight:600}
.w-note.n0{left:0;top:24px;animation-delay:-1s}
.w-note.n1{right:2px;top:4px;animation-delay:-2.5s}
.w-note.n2{left:8%;top:122px;animation-delay:-4s;z-index:2}
.w-note.n3{right:0;top:162px;animation-delay:-3s}
.w-note.n4{left:4px;top:218px;animation-delay:-5s}
.w-hand{position:absolute;right:12px;bottom:6px}
@keyframes float{0%,100%{transform:rotate(var(--r)) translateY(0)}50%{transform:rotate(var(--r)) translateY(-7px)}}
.w-copy{display:flex;flex-direction:column;gap:14px;margin-top:auto;padding-top:20px}
.w-copy .wordmark{font-size:44px}
.w-tag{font-family:var(--f-display);font-weight:400;font-size:40px;line-height:1.02;letter-spacing:-.02em}
.w-copy p{color:var(--ink-2);font-size:15.5px;max-width:42ch}
.w-cta{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.welcome.d{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);align-items:center;gap:40px;padding:56px 72px;min-height:100%}
.welcome.d .w-copy{margin:0;gap:18px;padding:0}
.welcome.d .w-copy .wordmark{font-size:56px}
.welcome.d .w-tag{font-size:64px}
.welcome.d .w-cta{flex-direction:row;gap:10px}
.welcome.d .w-notes{height:520px}
.welcome.d .w-note{width:200px;padding:16px 16px 18px}
.welcome.d .w-note b{font-size:17px} .welcome.d .w-note span{font-size:14px}
.welcome.d .w-note.n0{left:4%;top:40px} .welcome.d .w-note.n1{right:6%;top:10px} .welcome.d .w-note.n2{left:30%;top:190px}
.welcome.d .w-note.n3{right:2%;top:250px} .welcome.d .w-note.n4{left:6%;top:350px}
.welcome.d .w-hand{right:12%;bottom:36px;font-size:15px}

/* ---------- onboarding ---------- */
.ob-modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ob-mode{display:flex;align-items:center;gap:10px;padding:12px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--card);font-weight:600;font-size:13.5px;text-align:left;transition:border-color .15s}
.ob-mode .mi{width:22px;display:grid;place-items:center;color:var(--muted);flex-shrink:0}
.ob-mode.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.ob-mode.on .mi{color:var(--ink)}
.ruled{width:100%;min-height:220px;border:1px solid var(--line-2);border-radius:var(--r-lg);background:var(--card);padding:18px 20px;font-size:16.5px;line-height:1.6;resize:none;outline:none}
.ruled:focus{border-color:var(--ink-2)}
.ruled::placeholder{color:var(--faint)}
.rec{display:flex;flex-direction:column;align-items:center;gap:14px;padding:28px 18px;border-radius:var(--r-lg);background:var(--card);border:1px solid var(--line)}
.rec-btn{width:76px;height:76px;border-radius:50%;background:var(--rose);color:#fff;display:grid;place-items:center}
.rec-btn.on{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--rose-soft)}50%{box-shadow:0 0 0 14px var(--rose-soft)}}
.wave{display:flex;align-items:center;gap:3px;height:34px}
.wave i{width:3px;border-radius:2px;background:var(--rose);height:6px}
.wave.on i{animation:wave 1s ease-in-out infinite}
@keyframes wave{0%,100%{height:6px}50%{height:30px}}
.csv{display:flex;flex-direction:column;gap:12px}
.drop-box{border:1.5px dashed var(--line-2);border-radius:var(--r-lg);padding:26px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;background:var(--card)}
.ctable{width:100%;border-collapse:collapse;font-size:13px}
.ctable th,.ctable td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.ctable th{font-size:12px;font-weight:500;color:var(--muted)}
.scrollx{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md);background:var(--card)}
.gen{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;min-height:100%;text-align:center;padding:30px 10px}
.gen-notes{position:relative;width:200px;height:150px}
.gen-notes i{position:absolute;width:86px;height:70px;border-radius:4px 4px 12px 4px;box-shadow:var(--sh-note);animation:shuffle 2.4s ease-in-out infinite}
.gen-notes i:nth-child(1){background:var(--powder);left:10px;top:30px;--r:-8deg}
.gen-notes i:nth-child(2){background:var(--sage);left:58px;top:12px;--r:5deg;animation-delay:-.6s}
.gen-notes i:nth-child(3){background:var(--blush);left:100px;top:38px;--r:-3deg;animation-delay:-1.2s}
.gen-notes i:nth-child(4){background:var(--peach);left:52px;top:62px;--r:9deg;animation-delay:-1.8s}
@keyframes shuffle{0%,100%{transform:rotate(var(--r)) translate(0,0)}50%{transform:rotate(calc(var(--r)*-1)) translate(0,-10px)}}
.steps{display:flex;flex-direction:column;gap:10px;text-align:left;min-width:240px}
.steps div{display:flex;align-items:center;gap:10px;font-size:14.5px;color:var(--muted);transition:color .3s}
.steps div.on{color:var(--ink)}
.steps .sd{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;flex-shrink:0}
.steps div.on .sd{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.heard{font-size:15px;line-height:1.75;color:var(--ink-2)}
.heard mark{background:var(--c);color:var(--ink);padding:2px 5px;border-radius:5px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.rcard{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-radius:var(--r-md);background:var(--card);border:1px solid var(--line)}
.rcard .top{display:flex;align-items:center;gap:10px}
.dayck{display:flex;gap:4px;flex-wrap:wrap}
.dayck button{width:34px;height:30px;border-radius:9px;font-size:12px;font-weight:650;background:var(--paper-2);color:var(--muted)}
.dayck button.on{background:var(--c);color:var(--ci)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:999px;height:34px;background:var(--card)}
.stepper button{width:34px;height:32px;display:grid;place-items:center;color:var(--ink-2);border-radius:999px}
.stepper button:hover{background:var(--paper-2)}
.stepper span{min-width:62px;text-align:center;font-size:13.5px;font-weight:650;font-variant-numeric:tabular-nums}
.alert{display:flex;gap:12px;padding:14px 16px;border-radius:var(--r-md);align-items:flex-start}
.alert.warn{background:var(--warn-bg)} .alert.warn .ai{color:var(--warn)}
.alert.over{background:var(--over-bg)} .alert.over .ai{color:var(--over)}
.alert.info{background:var(--sage)} .alert.info .ai{color:var(--sage-ink)}
.alert .h3{font-size:14.5px}
.alert p{font-size:13.5px;color:var(--ink-2);margin-top:2px}
.spread{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.spread .sc{display:flex;flex-direction:column;gap:4px;min-width:0}
.spread .sh{font-size:12px;font-weight:600;color:var(--muted);text-align:center}
.spread .sb{height:118px;border-radius:10px;background:var(--paper-2);position:relative;overflow:hidden;display:flex;flex-direction:column-reverse;padding:3px;gap:3px}
.spread .sb i{display:block;border-radius:6px;background:var(--c);min-height:6px}
.spread .sf{font-size:11px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.sumbar{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--line);gap:2px}
.sumbar i{display:block;height:100%}

/* ---------- chapters / goals ---------- */
.ch-card{position:relative;display:flex;flex-direction:column;gap:12px;padding:20px;border-radius:var(--r-xl);background:var(--c);text-align:left;overflow:hidden;transition:transform .2s;min-width:0}
.ch-card:hover{transform:translateY(-2px)}
.ch-card .h2{color:var(--ink)}
.ch-card .cm{font-size:13px;color:var(--ci);font-weight:600}
.ch-card .pbar{background:rgba(255,255,255,.55)} .ch-card .pbar i{background:var(--ci)}
.ch-card.big{padding:24px;gap:14px}
.ch-card.big .h2{font-size:30px}
.ch-status{position:absolute;top:18px;right:18px;font-size:12px;font-weight:650;color:var(--ci);border:1.5px solid var(--ci);border-radius:999px;padding:3px 9px}
.ch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.ch-new{border:1.5px dashed var(--line-2);border-radius:var(--r-xl);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:160px;color:var(--muted);font-weight:600}
.ch-new:hover{border-color:var(--rose);color:var(--blush-ink)}
.ch-cover{border-radius:var(--r-xl);background:var(--c);padding:22px;display:flex;flex-direction:column;gap:10px}
.ch-cover .h1{color:var(--ink)}
.ch-cover .cm{color:var(--ci);font-weight:600;font-size:13.5px}
.gcard{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:var(--r-lg);background:var(--card);border:1px solid var(--line);text-align:left;width:100%;transition:border-color .15s}
.gcard:hover{border-color:var(--ink-2)}
.rhythm{display:flex;flex-wrap:wrap;gap:8px}
.rhythm span{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:var(--c);font-size:13px;font-weight:600;color:var(--ink)}
.rhythm span em{font-style:normal;color:var(--ci)}
.tmpl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tmpl button{display:flex;flex-direction:column;gap:4px;padding:16px;border-radius:var(--r-lg);background:var(--c);text-align:left;min-height:104px;border:2px solid transparent;transition:border-color .15s}
.tmpl button.on{border-color:var(--ci)}
.tmpl b{font-weight:650;font-size:16px;color:var(--ink)}
.tmpl span{font-size:12.5px;color:var(--ci);font-weight:550}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:40px;height:40px;border-radius:50%;background:var(--c);border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
.swatches button.on{border-color:var(--ci)}
.mt{position:relative;display:flex;flex-direction:column;gap:6px}
.mt::before{content:"";position:absolute;left:15px;top:22px;bottom:22px;width:2px;background:var(--line-2);border-radius:2px}
.ms{position:relative;display:flex;gap:14px;align-items:flex-start}
.ms-node{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;background:var(--paper);border:2px solid var(--line-2);position:relative;z-index:1;margin-top:12px;color:var(--btn-ink)}
.ms.done .ms-node{background:var(--btn);border-color:var(--btn)}
.ms.current .ms-node{border-color:var(--rose);background:var(--rose-soft)}
.ms.current .ms-node::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--rose)}
.ms-body{flex:1;min-width:0;padding:12px 14px;border-radius:var(--r-md);background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.ms.current .ms-body{border-color:var(--rose)}
.ms-head{display:flex;align-items:center;gap:10px;width:100%;text-align:left}
.ms-head .h3{flex:1;min-width:0}
.ms.done .ms-head .h3{color:var(--muted)}
.goal-hero{border-radius:var(--r-xl);padding:24px;background:var(--c);display:flex;flex-direction:column;gap:14px}
.goal-hero .gt{font-family:var(--f-display);font-weight:500;font-size:24px;line-height:1.15;letter-spacing:-.01em;color:var(--ink);text-wrap:balance}
.d-app .goal-hero .gt{font-size:28px}
.goal-hero .pbar{background:rgba(255,255,255,.6);height:10px} .goal-hero .pbar i{background:var(--ci)}

/* ---------- settings ---------- */
.sgroup{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.srow{display:flex;align-items:center;gap:12px;padding:14px 16px;min-height:56px;width:100%;text-align:left}
.srow + .srow{border-top:1px solid var(--line)}
.srow .sl{flex:1;min-width:0}
.srow .sl b{font-weight:600;display:block}
.srow .sl span{font-size:12.5px;color:var(--muted)}
.srow .si{width:22px;display:grid;place-items:center;color:var(--muted);flex-shrink:0}
.srow input[type=time]{height:36px;border-radius:10px;border:1px solid var(--line-2);background:var(--paper);padding:0 8px;font-variant-numeric:tabular-nums}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.plan{border-radius:var(--r-lg);padding:20px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.plan.plus{background:var(--blush);border-color:transparent}
.plan .price{font-weight:600;font-size:28px;line-height:1}
.plan .price small{font-family:var(--f-ui);font-size:13px;color:var(--muted)}
.plan ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px;font-size:13.5px}
.plan li{display:flex;gap:8px;align-items:flex-start}
.plan li svg{flex-shrink:0;margin-top:2px;color:var(--sage-ink)}
.plan.plus li svg{color:var(--blush-ink)}
.s-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;align-items:start}
.s-grid > *{min-width:0}

/* ---------- design system page ---------- */
.ds{max-width:1180px;margin:0 auto;padding-block:36px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:44px}
.ds-head{display:flex;flex-direction:column;gap:10px}
.ds-head .h1{font-size:clamp(34px,6vw,54px)}
.ds-tabs{position:sticky;top:0;z-index:5;background:var(--shell);padding:10px 0}
.m-app .h1{font-size:28px}
.ds-sec{display:flex;flex-direction:column;gap:16px}
.ds-sec > .h2{font-size:28px}
.ds-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.sw{border-radius:var(--r-md);overflow:hidden;border:1px solid var(--line);background:var(--card)}
.sw div{height:74px}
.sw p{padding:9px 11px;font-size:12.5px;display:flex;flex-direction:column;gap:1px}
.sw p b{font-weight:650} .sw p span{color:var(--muted);font-family:ui-monospace,Menlo,monospace;font-size:11.5px}
.ds-box{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.ds-box > .label{margin-bottom:-2px}
.ds-two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.ds-two > *{min-width:0}
.tscale{display:flex;flex-direction:column;gap:14px}
.tscale div{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px}
.tscale code{font-size:11.5px;color:var(--muted);width:150px;flex-shrink:0;font-family:ui-monospace,Menlo,monospace}
.spc{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.spc div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.spc i{display:block;background:var(--blush);border-radius:3px}
.rads{display:flex;gap:14px;flex-wrap:wrap}
.rads div{width:76px;height:64px;background:var(--powder);display:grid;place-items:center;font-size:11.5px;color:var(--powder-ink);font-weight:600}
.shds{display:flex;gap:18px;flex-wrap:wrap}
.shds div{width:120px;height:80px;background:var(--card);border-radius:14px;display:grid;place-items:center;font-size:12px;color:var(--muted)}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.icons div{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:12px;background:var(--paper-2);font-size:11px;color:var(--muted)}
.ds ul.notes{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:9px;color:var(--ink-2);max-width:78ch}
.ds ul.notes b{color:var(--ink)}
.comp-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.comp-list div{padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--muted)}
.comp-list b{display:block;color:var(--ink);font-size:14px;margin-bottom:2px;font-family:ui-monospace,Menlo,monospace;font-weight:600}
.code{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--paper-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow-x:auto;white-space:pre}
.mini-phone{width:300px;max-width:100%;height:300px;border-radius:30px;border:8px solid var(--frame);position:relative;overflow:hidden;background:var(--paper)}
.mini-phone .scrim{animation:none}
.mini-phone .sheet{position:absolute;bottom:0;left:0;right:0;animation:none;max-height:none}
.mini-phone .m-nav{position:absolute;left:8px;right:8px;bottom:8px;height:58px}

/* ================= derived data ================= */
function fixedOn(fixed,d){return fixed.filter(f=>f.days.includes(d)).sort((a,b)=>a.start-b.start)}
function overlap(a1,a2,b1,b2){return Math.max(0,Math.min(a2,b2)-Math.max(a1,b1))}
function freeFor(fixedList,settings){const busy=fixedList.reduce((a,f)=>a+overlap(f.start,f.end,settings.wake,settings.sleep),0);return Math.max(0,settings.sleep-settings.wake-busy-settings.buffer)}
function loadOf(planned,free){const r=free>0?planned/free:(planned>0?2:0);const k=planned===0?'none':r<.5?'light':r<.85?'balanced':r<=1?'full':'over';return{r,k:k==='none'?'light':k,empty:planned===0,label:{none:'Open',light:'Light',balanced:'Balanced',full:'Full',over:'Over capacity'}[k]}}
function remOn(S,d,wk=0){return (S.reminders||[]).filter(r=>r.days.includes(d)).map(r=>{const sn=wk===0?((r.snooze||{})[d]||0):0;return{...r,at:r.time-r.lead+sn,done:wk===0&&(r.doneDays||[]).includes(d)}}).sort((a,b)=>a.at-b.at)}
/* a "time to leave" reminder ends any fixed block it falls inside (leaving work early) */
function cutFixed(fx,rs){return fx.map(f=>{const r=rs.find(x=>x.leave&&x.at>f.start&&x.at<f.end);return r?{...f,end:r.at,cutBy:r}:f})}
function remSub(r){return [r.leave?`Leave at ${fmtT(r.at??r.time-r.lead)} for ${fmtT(r.time)}`:r.lead?`Heads-up ${fmtD(r.lead)} before ${fmtT(r.time)}`:null,r.note||null].filter(Boolean).join(' · ')||'Reminder at the time'}
function toLine(title){return title.charAt(0).toLowerCase()+title.slice(1)}
function parseReminder(v){
  const t=v.trim();let m=t.match(/^remind me (?:at|by) (\d{1,2})(?:[:.](\d{2}))?\s*(am|pm)?\s*(?:to |that |about )?(.+)$/i);let h,mi,ap,title;
  if(m){[,h,mi,ap,title]=m}else{m=t.match(/^remind me (?:to |about |that )?(.+?) (?:at|by) (\d{1,2})(?:[:.](\d{2}))?\s*(am|pm)?$/i);if(!m)return null;[,title,h,mi,ap]=m}
  h=+h;mi=+(mi||0);if(ap){ap=ap.toLowerCase();if(ap==='pm'&&h<12)h+=12;if(ap==='am'&&h===12)h=0}else if(h<7)h+=12;
  if(h>23||mi>59||!title)return null;title=title.trim().replace(/\.$/,'');title=title.charAt(0).toUpperCase()+title.slice(1);
  return{title,time:h*60+mi,lead:0,leave:/^leave\b/i.test(title)};
}
/* overnight rollover: each unfinished task for today goes to the first later day that still has room */
function rolloverPlan(S){const extra=[0,0,0,0,0,0,0];
  return S.tasks.filter(t=>t.day===0&&!t.done).sort((a,b)=>b.pri-a.pri).map(t=>{
    for(let d=1;d<7;d++){const i=dayInfo(S,d,0);const room=i.free-i.planned-extra[d];if(t.dur<=room){extra[d]+=t.dur;return{t,to:d,why:`${DAYF[d]} still has ${fmtD(room)} free`}}}
    return{t,to:null,why:'No day has room yet'}})}
function dayInfo(S,d,wk=0){
  const fixed=cutFixed(fixedOn(S.fixed,d),remOn(S,d,wk));
  const flex=wk===0?S.tasks.filter(t=>t.day===d):[];
  const free=freeFor(fixed,S.settings);
  const planned=flex.reduce((a,t)=>a+t.dur,0);
  const left=flex.filter(t=>!t.done).reduce((a,t)=>a+t.dur,0);
  return{fixed,flex,free,planned,left,load:loadOf(planned,free)};
}
function gapsOn(S,d,wk=0){
  const {fixed,flex}=dayInfo(S,d,wk);
  const occ=[...fixed.map(f=>[f.start,f.end]),...flex.filter(t=>t.time!=null).map(t=>[t.time,t.time+t.dur])].sort((a,b)=>a[0]-b[0]);
  const out=[];let cur=S.settings.wake;const end=S.settings.sleep;
  for(const[s,e]of occ){const ss=Math.min(s,end);if(ss-cur>=30)out.push({s:cur,e:ss});cur=Math.max(cur,e)}
  if(end-cur>=30)out.push({s:cur,e:end});
  return out;
}
function msInfo(S,m){const ts=S.tasks.filter(t=>t.ms===m.id);const done=ts.filter(t=>t.done).length;const p=ts.length?done/ts.length:(m.done?1:0);return{...m,tasks:ts,done,total:ts.length,p}}
function goalInfo(S,g){
  const ms=g.ms.map(m=>msInfo(S,m));let found=false;
  ms.forEach(m=>{if(m.p>=1&&(m.total>0||m.done))m.state='done';else if(!found){m.state='current';found=true}else m.state='upcoming'});
  const ts=S.tasks.filter(t=>t.goal===g.id);const done=ts.filter(t=>t.done).length;
  return{...g,msi:ms,steps:ts.length,stepsDone:done,p:ms.reduce((a,m)=>a+m.p,0)/ms.length,next:ms.find(m=>m.state==='current')};
}
function chapterInfo(S,c){
  const s=parseD(c.start),e=parseD(c.end);const total=daysBetween(s,e)+1;
  const elapsed=clamp(daysBetween(s,TODAY)+1,0,total);
  const tp=c.status==='past'?1:c.status==='next'?0:elapsed/total;
  const gs=c.goals.map(id=>S.goals.find(g=>g.id===id)).filter(Boolean).map(g=>goalInfo(S,g));
  const gp=c.status==='past'?1:gs.length?gs.reduce((a,g)=>a+g.p,0)/gs.length:0;
  return{...c,s,e,total,elapsed,left:total-elapsed,tp,gs,gp,startsIn:daysBetween(TODAY,s)};
}

      onEnter:els=>G.fromTo(els,{autoAlpha:0,y:10},{autoAlpha:1,y:0,duration:.35,delay:.12,ease:'power2.out'})})}catch(e){}},[tasks]);

  S.addReminder=r=>{const nr={id:'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,4),cat:'personal',note:'',doneDays:[],lead:0,leave:false,nag:false,...r};setReminders(rs=>[...rs,nr]);return nr};
  S.remToggle=(id,d)=>setReminders(rs=>rs.map(r=>r.id!==id?r:{...r,doneDays:(r.doneDays||[]).includes(d)?r.doneDays.filter(x=>x!==d):[...(r.doneDays||[]),d]}));
  S.remSnooze=(id,d,min=10)=>{const r=reminders.find(x=>x.id===id);if(!r)return;const cur=(r.snooze||{})[d]||0;const base=r.time-r.lead+cur;const next=d===0?Math.max(base,NOW)+min:base+min;

function Generating({S}){

function spreadPlan(R,settings){
  const cap=DAYS.map((_,d)=>freeFor(cutFixed(fixedOn(R.fixed,d),(R.reminders||[]).filter(r=>r.days.includes(d)).map(r=>({...r,at:r.time-r.lead}))),settings));
  const plan=DAYS.map(()=>[]);
  const sessions=R.flex.flatMap(a=>Array.from({length:a.freq},()=>a)).sort((x,y)=>y.dur-x.dur);
  sessions.forEach(a=>{let best=0,bs=1e9;for(let d=0;d<7;d++){const used=plan[d].reduce((s,x)=>s+x.dur,0);const sc=(used+a.dur)/Math.max(cap[d],1)+(d>=5?.45:0)+(d===6?.25:0)+(plan[d].some(x=>x.id===a.id)?1.5:0);if(sc<bs){bs=sc;best=d}}plan[best].push(a)});
  return{cap,plan,used:plan.map(p=>p.reduce((s,x)=>s+x.dur,0))};
}
function Highlighted({text}){
  if(!text)return null;
  const segs=[];let rest=text;let guard=0;
  while(rest&&guard++<40){let best=null;for(const[ph,cat]of HEARD){const i=rest.toLowerCase().indexOf(ph.toLowerCase());if(i>=0&&(!best||i<best.i))best={i,ph,cat}}
    if(!best){segs.push(rest);break}segs.push(rest.slice(0,best.i));segs.push({t:rest.substr(best.i,best.ph.length),cat:best.cat});rest=rest.slice(best.i+best.ph.length)}
  return html`<p className="heard">${segs.map((s,i)=>typeof s==='string'?s:html`<mark key=${i} style=${cs(s.cat)}>${s.t}</mark>`)}</p>`;
}

    <div className="row" style=${{justifyContent:'space-between'}}><h3 className="h3">This week</h3><button className="btn ghost sm" onClick=${()=>{S.setWeekOff(0);S.setCalView('week');S.setScreen('calendar')}}>Calendar <${Icon} n="arrowR" s=${15}/></button></div>
    ${DAYS.map((dn,d)=>{const i=dayInfo(S,d,0);return html`<button key=${d} className="row" style=${{gap:12}} onClick=${()=>{S.setWeekOff(0);S.setSelDay(d);S.setCalView('day');S.setScreen('calendar')}}>
      <span style=${{width:34,fontWeight:650,fontSize:13,color:d===0?'var(--rose)':'var(--ink-2)'}}>${dn}</span>
      <div className="grow"><${LoadBar} load=${i.load}/></div>
      <span className="small muted tnum" style=${{width:92,textAlign:'right'}}>${i.flex.length?`${i.flex.length} · ${i.load.label}`:'Open'}</span></button>`})}
  </div>`;
}
function ChapterMini({S}){
  const c=chapterInfo(S,S.chapters.find(x=>x.status==='now')||S.chapters[0]);
  const g=goalInfo(S,S.goals[0]);
  return html`<button className="ch-card" style=${csColor(c.color)} onClick=${()=>{S.setChapterId(c.id);S.setScreen('chapter')}}>
    <span className="cm">Current chapter</span><h3 className="h2">${c.name}</h3>
    <${PBar} p=${c.tp}/><span className="cm tnum">Day ${c.elapsed} of ${c.total} · ${c.left} days left</span>
    ${g.next&&html`<div style=${{borderTop:'1px solid rgba(0,0,0,.06)',paddingTop:10}}><span className="cm">Next milestone</span><div className="h3" style=${{color:'var(--ink)',marginTop:2}}>${g.next.title} <span className="small" style=${{color:'var(--ci)'}}>by ${g.next.due}</span></div></div>`}
  </button>`;
}
function Today({S,mobile}){
  const ti=dayInfo(S,0,0);const lv=remOn(S,0,0).find(r=>r.leave&&!r.done);
  const greetLine=`Monday 26 October · ${lv?`Leave work at ${fmtT(lv.at)} to ${toLine(lv.title)}`:`${fmtD(ti.free)} free today`}`;
  const seg=html`<${Seg} label="Today view" value=${S.todayMode} onChange=${S.setTodayMode} options=${[['visual','Visual day','clock'],['list','Checklist','list']]} full=${mobile}/>`;
  if(mobile)return html`<div>
    <div className="m-top"><div><h1 className="h1">Good morning, Lena</h1><p className="subline">${greetLine}</p></div><button className="avatar" aria-label="Settings" onClick=${()=>S.setScreen('settings')}>L</button></div>
    <div className="stack" style=${{marginTop:18,gap:14}}><${MorningPlan} S=${S}/><${DontForget} S=${S}/><${DayProgress} S=${S}/></div>
    <div style=${{marginTop:18}}>${seg}</div>
    ${S.todayMode==='visual'?html`<${TodayVisual} S=${S} mobile=${true}/>`:html`<${TodayList} S=${S}/>`}
  </div>`;
  return html`<div>
    <div className="d-head"><div><h1 className="h1">Good morning, Lena</h1><p className="subline">${greetLine}</p></div><div className="row">${seg}<button className="btn primary" onClick=${()=>S.openNew({day:0})}><${Icon} n="plus" s=${18}/>New task</button></div></div>
    <div style=${{marginBottom:24}}><${MorningPlan} S=${S}/></div>
    <div className="d-cols"><div>${S.todayMode==='visual'?html`<${TodayVisual} S=${S}/>`:html`<div style=${{marginTop:-28}}><${TodayList} S=${S}/></div>`}</div>
      <div className="stack d-aside" style=${{gap:16}}><${DontForget} S=${S}/><${DayProgress} S=${S}/><${WeekGlance} S=${S}/><${ChapterMini} S=${S}/></div></div>
  </div>`;
}

/* ================= calendar ================= */
function DayPanel({S,mobile}){
  const d=S.selDay,wk=S.weekOff;const info=dayInfo(S,d,wk);const dt=dayDate(wk,d);
  const items=[...info.flex].sort((a,b)=>(a.done-b.done)||((a.time??-1)-(b.time??-1)));
  const dump=S.tasks.filter(t=>t.day==null&&!t.done);
  const [over,setOver]=useState(false);
  return html`<div className="stack" style=${{gap:14}}>
    <h2 className="h2">${DAYF[d]}, ${dt.getDate()} ${MONF[dt.getMonth()]}${wk===0&&d===0?' · today':''}</h2>
    <div className="statrow"><div className="stat"><b className="tnum">${fmtD(info.free).replace(' min','m')}</b><span>Free</span></div><div className="stat"><b className="tnum">${info.planned?fmtD(info.planned).replace(' min','m'):'0'}</b><span>Planned</span></div><div className="stat" style=${{display:'flex',flexDirection:'column',justifyContent:'center',gap:6}}><${LoadPill} load=${info.load}/><span>Load</span></div></div>
    ${info.fixed.length>0&&html`<div className="list">${info.fixed.map(f=>html`<${FixRow} key=${f.id} S=${S} f=${f}/>`)}</div>`}
    ${remOn(S,d,wk).length>0&&html`<div><div className="sec-h" style=${{marginBottom:10}}><h3 className="h3 row" style=${{gap:8}}><${Icon} n="bell" s=${16}/>Reminders</h3><span className="small muted">${remOn(S,d,wk).length}</span></div>
      <div className="list">${remOn(S,d,wk).map(r=>html`<${RemRow} key=${r.id} S=${S} r=${r} d=${d} wk=${wk}/>`)}</div></div>`}
    <div className=${cx('dropzone',over&&'drop')} onDragOver=${!mobile&&wk===0?e=>{e.preventDefault();setOver(true)}:null} onDragLeave=${()=>setOver(false)}
      onDrop=${!mobile&&wk===0?e=>{e.preventDefault();setOver(false);const id=e.dataTransfer.getData('text/plain');if(id){S.update(id,{day:d,time:null});S.toast(`Kept flexible on ${DAYF[d]}.`)}}:null}>
      <div className="sec-h" style=${{marginBottom:10}}><h3 className="h3">Flexible this day</h3>${!mobile&&wk===0&&html`<span className="small muted">Drag onto the grid to place</span>`}</div>
      <div className="list">
        ${items.map(t=>html`<${FlexCard} key=${t.id} S=${S} t=${t} drag=${!mobile&&wk===0}/>`)}
        ${items.length===0&&html`<div className="card" style=${{textAlign:'center',padding:'22px 16px'}}><div className="h3">${wk===0?'Nothing flexible here yet':'Nothing planned for this week yet'}</div><p className="small muted" style=${{margin:'4px 0 12px'}}>${wk===0?`${fmtD(info.free)} of free time on ${DAYF[d]}.`:'Fixed commitments repeat every week. Flexible tasks start when you plan them.'}</p>${wk===0&&html`<button className="btn secondary sm" onClick=${()=>S.openNew({day:d})}><${Icon} n="plus" s=${16}/>Add a task</button>`}</div>`}
      </div>
    </div>
    ${!mobile&&wk===0&&dump.length>0&&html`<div><div className="sec-h" style=${{marginBottom:10}}><h3 className="h3"><${Icon} n="inbox" s=${16}/>From your brain dump</h3><span className="small muted">Drag onto a day</span></div>
      <div className="list">${dump.slice(0,4).map(t=>html`<${FlexCard} key=${t.id} S=${S} t=${t} drag=${true}/>`)}</div></div>`}
  </div>`;
}
function Calendar({S,mobile}){
  const v=S.calView;
  const label=v==='month'?(()=>{const b=new Date(2026,9+S.monthOff,1);return `${MONF[b.getMonth()]} ${b.getFullYear()}`})():v==='day'?(()=>{const dt=dayDate(S.weekOff,S.selDay);return `${mobile?DAYS[S.selDay]:DAYF[S.selDay]}, ${dt.getDate()} ${MONS[dt.getMonth()]}`})():(()=>{const a=dayDate(S.weekOff,0),b=dayDate(S.weekOff,6);return `${a.getDate()} ${MONS[a.getMonth()]} – ${b.getDate()} ${MONS[b.getMonth()]}`})();
  const step=dir=>{if(v==='month')S.setMonthOff(m=>m+dir);else if(v==='week')S.setWeekOff(w=>w+dir);else{let d=S.selDay+dir;if(d<0){S.setWeekOff(w=>w-1);d=6}if(d>6){S.setWeekOff(w=>w+1);d=0}S.setSelDay(d)}};
  const goToday=()=>{S.setWeekOff(0);S.setSelDay(0);S.setMonthOff(0)};
  const seg=html`<${Seg} label="Calendar view" value=${v} onChange=${S.setCalView} options=${[['day','Day'],['week','Week'],['month','Month']]} full=${mobile}/>`;
  const nav=html`<div className="row" style=${{gap:4}}><button className="ibtn" aria-label="Previous" onClick=${()=>step(-1)}><${Icon} n="chevL"/></button><button className="ibtn" aria-label="Next" onClick=${()=>step(1)}><${Icon} n="chevR"/></button>${(S.weekOff!==0||S.monthOff!==0||S.selDay!==0)&&html`<button className="btn ghost sm" onClick=${goToday}>Today</button>`}</div>`;
  const chapterBand=html`<div className="row small" style=${{gap:8,color:'var(--blush-ink)',fontWeight:600}}><span className="dot" style=${csColor('blush')}></span>Chapter: The Remote Job Era · 1 Sep – 31 Jan</div>`;
  if(mobile)return html`<div>
    <div className="m-top"><div><h1 className="h1">${label}</h1></div>${nav}</div>
    <div style=${{marginTop:14}}>${seg}</div>
    ${v==='day'&&html`<div className="dstrip" style=${{marginTop:14}}>${DAYS.map((dn,d)=>{const i=dayInfo(S,d,S.weekOff);const dt=dayDate(S.weekOff,d);return html`<button key=${d} className=${cx(S.selDay===d&&'sel',S.weekOff===0&&d===0&&'today')} onClick=${()=>S.setSelDay(d)} aria-label=${DAYF[d]}><span className="dn">${dn.slice(0,1)}</span><span className="dd">${dt.getDate()}</span><span className=${'ld '+(i.flex.length?i.load.k:'none')}></span></button>`})}</div>`}
    <div style=${{marginTop:14}}>
      ${v==='week'&&html`<${WeekGrid} S=${S} compact=${true}/>`}
      ${v==='day'&&html`<${Timeline} S=${S} d=${S.selDay} wk=${S.weekOff} hourPx=${42} onGap=${S.weekOff===0?(d,g)=>S.setSheet({type:'place',day:d,gap:g}):null}/>`}
      ${v==='month'&&html`<div className="stack" style=${{gap:12}}>${chapterBand}<${MonthGrid} S=${S} mobile=${true}/></div>`}
    </div>
    ${v!=='month'&&html`<div className="sec"><${DayPanel} S=${S} mobile=${true}/></div>`}
    <div className="legend" style=${{marginTop:20}}><span><i style=${{background:'var(--powder)'}}></i>Fixed</span><span><i style=${{border:'1.5px dashed var(--muted)',background:'var(--card)'}}></i>Flexible, placed</span><span><i style=${{background:'var(--card)',border:'1px solid var(--line)'}}></i>Free</span></div>
  </div>`;
  return html`<div>
    <div className="d-head"><div><h1 className="h1">${label}</h1><p className="subline">Fixed hours stay put. Flexible tasks wait in the panel until you place them.</p></div><div className="row">${nav}${seg}<button className="btn primary" onClick=${()=>S.openNew({day:S.selDay})}><${Icon} n="plus" s=${18}/>New task</button></div></div>
    <div className="d-cols" style=${{gridTemplateColumns:'minmax(0,1fr) 330px'}}>
      <div className="stack" style=${{gap:14}}>
        ${v==='week'&&html`<${WeekGrid} S=${S}/>`}
        ${v==='day'&&html`<div className="card" style=${{padding:'22px 20px 22px 16px'}}><${Timeline} S=${S} d=${S.selDay} wk=${S.weekOff} hourPx=${52} onGap=${S.weekOff===0?(d,g)=>S.setSheet({type:'place',day:d,gap:g}):null}/></div>`}
        ${v==='month'&&html`<div className="stack" style=${{gap:12}}>${chapterBand}<${MonthGrid} S=${S}/></div>`}
        <div className="legend"><span><i style=${{background:'var(--powder)'}}></i>Fixed: has an exact time</span><span><i style=${{border:'1.5px dashed var(--muted)',background:'var(--card)'}}></i>Flexible, placed by you</span><span><i style=${{background:'var(--card)',border:'1px solid var(--line)'}}></i>Free time</span><span><i style=${{background:'var(--paper-2)',border:'1px solid var(--line)'}}></i>Outside your day</span><span><i style=${{height:0,borderTop:'2px solid var(--ink)',borderRadius:0}}></i>Reminder</span></div>
      </div>
      <${DayPanel} S=${S}/>
    </div>
  </div>`;
}

/* ================= tasks ================= */
function Tasks({S,mobile}){
  const sec=S.tasksSec,cf=S.catFilter;
  const f=t=>cf==='all'||t.cat===cf;
  const groups={today:S.tasks.filter(t=>t.day===0&&!t.done),week:S.tasks.filter(t=>t.day>0&&!t.done),dump:S.tasks.filter(t=>t.day==null&&!t.done),rem:(S.reminders||[]).map(r=>({...r,at:r.time-r.lead,done:false})),done:S.tasks.filter(t=>t.done)};
  const secs=[['today','Today','sun'],['week','This week','cal'],['dump','Brain dump','inbox'],['rem','Reminders','bell'],['done','Completed','check']];
  const items=groups[sec].filter(f);
  const usedCats=Object.keys(CATS).filter(c=>c!=='work');
  const rots=[-1.4,1,-.5,1.5,-1,.6];
  const emptyCopy={today:['Today is clear.','Nothing flexible left. Pull something from this week or rest.'],week:['Nothing else this week.','Flexible tasks for the rest of the week will show up here.'],dump:['Your brain dump is empty.','Write down anything on your mind. No date needed.'],rem:['No reminders yet.','Type "remind me at 4 to leave for pickup" and Dayli sets it up.'],done:['Nothing completed yet.','Check something off and it lands here.']}[sec];
  const add=sec==='done'?null:sec==='rem'?html`<${QuickAdd} S=${S} day=${0} remOnly=${true} placeholder="Remind me at 4 to leave for pickup"/>`:html`<${QuickAdd} S=${S} day=${sec==='today'?0:sec==='week'?1:null} placeholder=${sec==='today'?'Add to today, or "remind me at 4 to…"':sec==='week'?'Add for tomorrow':'Dump a thought, plan it later'}/>`;
  let content;
  if(items.length===0)content=html`<${Empty} title=${emptyCopy[0]} body=${emptyCopy[1]}/>`;
  else if(sec==='rem')content=html`<div className="list">${[...items].sort((a,b)=>a.at-b.at).map(r=>html`<${RemRow} key=${r.id} S=${S} r=${r} wk=${1} showDays=${true}/>`)}</div>`;
  else if(sec==='dump')content=html`<div style=${{display:'grid',gridTemplateColumns:mobile?'repeat(2,minmax(0,1fr))':'repeat(auto-fill,minmax(200px,1fr))',gap:mobile?12:18}}>${items.map((t,i)=>html`<${Note} key=${t.id} S=${S} t=${t} plan=${true}/>`)}</div>`;
  else if(sec==='week'){const by=[1,2,3,4,5,6].map(d=>[d,items.filter(t=>t.day===d)]).filter(([,ts])=>ts.length);
    content=html`<div className="stack" style=${{gap:20}}>${by.map(([d,ts])=>html`<div key=${d}><div className="row" style=${{justifyContent:'space-between',marginBottom:8}}><span className="h3">${DAYF[d]} <span className="muted" style=${{fontWeight:500}}>${dayDate(0,d).getDate()} Oct</span></span><${LoadPill} load=${dayInfo(S,d,0).load}/></div><div className="list">${ts.map(t=>html`<${TaskRow} key=${t.id} S=${S} t=${t}/>`)}</div></div>`)}</div>`}
  else if(sec==='done'){const td=items.filter(t=>t.day===0),er=items.filter(t=>t.day!==0);
    content=html`<div className="stack" style=${{gap:20}}>${td.length>0&&html`<div><div className="h3" style=${{marginBottom:8}}>Today</div><div className="list">${td.map(t=>html`<${TaskRow} key=${t.id} S=${S} t=${t} showDay=${false}/>`)}</div></div>`}${er.length>0&&html`<div><div className="h3" style=${{marginBottom:8}}>Earlier</div><div className="list">${er.map(t=>html`<${TaskRow} key=${t.id} S=${S} t=${t}/>`)}</div></div>`}<p className="small muted">Tap a checkbox to bring a task back.</p></div>`}
  else content=html`<div className="list">${items.map(t=>html`<${TaskRow} key=${t.id} S=${S} t=${t}/>`)}</div>`;
  const head=html`<div className=${mobile?'m-top':'d-head'}><div><h1 className="h1">Tasks</h1></div>${!mobile&&html`<button className="btn primary" onClick=${()=>S.openNew(sec==='rem'?{kind:'rem'}:{day:sec==='dump'?null:sec==='week'?1:0})}><${Icon} n="plus" s=${18}/>${sec==='rem'?'New reminder':'New task'}</button>`}</div>`;
  return html`<div>
    ${head}
    <div className="chips scroll" style=${{marginTop:mobile?16:0}} role="tablist" aria-label="Sections">${secs.map(([v,l,ic])=>html`<button key=${v} role="tab" aria-selected=${sec===v} className=${cx('chip',sec===v&&'on')} onClick=${()=>S.setTasksSec(v)}><${Icon} n=${ic} s=${16}/>${l}<span className="n">${groups[v].filter(f).length}</span></button>`)}</div>
    <div className="chips scroll" style=${{marginTop:10}} aria-label="Filter by category"><button className=${cx('chip',cf==='all'&&'on')} style=${{height:32}} onClick=${()=>S.setCatFilter('all')}>All</button>${usedCats.map(c=>html`<button key=${c} className=${cx('chip cat',cf===c&&'on')} style=${{...cs(c),height:32}} onClick=${()=>S.setCatFilter(cf===c?'all':c)}><span className="dot"></span>${CATS[c].label}</button>`)}</div>
    ${mobile?html`<div className="stack" style=${{marginTop:20,gap:16}}>${add}${content}</div>`
    :html`<div className="d-cols" style=${{marginTop:20}}><div className="stack" style=${{gap:16}}>${add}${content}</div>
      <div className="stack d-aside" style=${{gap:16}}><${WeekGlance} S=${S}/>
        <div className="card stack" style=${{gap:10}}><h3 className="h3">Open by category</h3>${usedCats.map(c=>{const ts=S.tasks.filter(t=>t.cat===c&&!t.done);const mins=ts.reduce((a,t)=>a+t.dur,0);return html`<button key=${c} className="row" style=${{gap:10}} onClick=${()=>S.setCatFilter(cf===c?'all':c)}><span className="dot" style=${cs(c)}></span><span className="grow" style=${{fontWeight:cf===c?650:500}}>${CATS[c].label}</span><span className="small muted tnum">${ts.length} · ${ts.length?fmtD(mins):'0 min'}</span></button>`})}</div></div></div>`}
  </div>`;
}

/* ================= chapters ================= */
function ChapterCard({S,c,big}){
  const ci=chapterInfo(S,c);
  const meta=c.status==='now'?`Day ${ci.elapsed} of ${ci.total} · ${ci.left} days left`:c.status==='next'?`Starts in ${ci.startsIn} days`:c.summary||'Closed';
  return html`<button className=${cx('ch-card',big&&'big')} style=${csColor(c.color)} onClick=${()=>{S.setChapterId(c.id);S.setScreen('chapter')}}>
    <span className="ch-status">${{now:'Now',next:'Next',past:'Closed'}[c.status]}</span>
    <span className="cm tnum">${fmtDate(ci.s)} – ${fmtDate(ci.e)}</span>
    <h3 className="h2" style=${{paddingRight:70}}>${c.name}</h3>
    ${big&&html`<p style=${{color:'var(--ink-2)',fontSize:14.5}}>${c.desc}</p>`}
    <${PBar} p=${ci.tp}/>
    <span className="cm">${meta}</span>
  </button>`;
}
function Chapters({S,mobile}){
  const now=S.chapters.filter(c=>c.status==='now'),next=S.chapters.filter(c=>c.status==='next'),past=S.chapters.filter(c=>c.status==='past');
  return html`<div>
    <div className=${mobile?'m-top':'d-head'}><div><h1 className="h1">Chapters</h1>${!mobile&&html`<p className="lede">A chapter is a stretch of time with its own goals and rhythm: a semester, a career sprint, a reset.</p>`}</div>${!mobile&&html`<button className="btn primary" onClick=${()=>S.setSheet({type:'chapter'})}><${Icon} n="plus" s=${18}/>New chapter</button>`}</div>
    ${mobile&&html`<p className="lede" style=${{marginTop:8}}>A stretch of time with its own goals and rhythm.</p>`}
    <div className="sec" style=${{marginTop:mobile?20:0}}><div className="stack" style=${{gap:14}}>${now.map(c=>html`<${ChapterCard} key=${c.id} S=${S} c=${c} big=${true}/>`)}</div></div>
    <div className="sec"><div className="sec-h"><h2 className="h3">Coming up</h2></div><div className="ch-grid">${next.map(c=>html`<${ChapterCard} key=${c.id} S=${S} c=${c}/>`)}<button className="ch-new" onClick=${()=>S.setSheet({type:'chapter'})}><${Icon} n="plus" s=${24}/>Start a new chapter</button></div></div>
    <div className="sec"><div className="sec-h"><h2 className="h3">Earlier chapters</h2><span className="small muted">${past.length}</span></div><div className="ch-grid">${past.map(c=>html`<${ChapterCard} key=${c.id} S=${S} c=${c}/>`)}</div></div>
  </div>`;
}
function ChapterDetail({S,mobile}){
  const c=S.chapters.find(x=>x.id===S.chapterId)||S.chapters[0];const ci=chapterInfo(S,c);
  const openTasks=S.tasks.filter(t=>c.goals.includes(t.goal)&&!t.done&&t.day!=null&&t.day>=0).sort((a,b)=>a.day-b.day).slice(0,6);
  const ms=ci.gs.flatMap(g=>g.msi.filter(m=>m.state!=='done').map(m=>({...m,g}))).slice(0,4);
  const main=html`
    <div className="sec" style=${{marginTop:mobile?24:0}}><div className="sec-h"><h2 className="h3"><${Icon} n="target" s=${17}/>Goals</h2><span className="small muted">${ci.gs.length}</span></div>
      ${ci.gs.length?html`<div className="list">${ci.gs.map(g=>html`<button key=${g.id} className="gcard" onClick=${()=>{S.setGoalId(g.id);S.setScreen('goals')}}>
        <div className="row"><span className="dot" style=${cs(g.cat)}></span><span className="h3 grow">${g.title}</span><${Icon} n="chevR" s=${18}/></div>
        <${PBar} p=${g.p} style=${{height:6}}/><span className="small muted tnum">${g.stepsDone} of ${g.steps} steps done · ${g.next?'next: '+g.next.title:'all milestones reached'}</span></button>`)}</div>`
      :html`<div className="card"><${Empty} title="No goals yet" body=${c.status==='past'?'This chapter was about rhythm, not targets.':'Add a goal when you know what this chapter is for.'} action=${c.status!=='past'&&html`<button className="btn secondary sm" onClick=${()=>S.toast('Goal creation follows the chapter flow in Phase 2.')}><${Icon} n="plus" s=${16}/>Add a goal</button>`}/></div>`}
    </div>
    ${c.rhythm.length>0&&html`<div className="sec"><div className="sec-h"><h2 className="h3"><${Icon} n="refresh" s=${17}/>Weekly rhythm</h2></div><div className="rhythm">${c.rhythm.map((r,i)=>html`<span key=${i} style=${cs(r.cat)}>${r.title}<em>${r.freq}× · ${fmtD(r.dur)}</em></span>`)}</div></div>`}
    ${openTasks.length>0&&html`<div className="sec"><div className="sec-h"><h2 className="h3">Coming up this week</h2><button className="btn ghost sm" onClick=${()=>{S.setTasksSec('week');S.setScreen('tasks')}}>All tasks</button></div><div className="list">${openTasks.map(t=>html`<${TaskRow} key=${t.id} S=${S} t=${t} showDay=${true}/>`)}</div></div>`}`;
  const side=html`
